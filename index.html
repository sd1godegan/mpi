<style>
:root{
  --bg:#FAF8F5;--surface:#FFFFFF;--surface-2:#F5F2EC;--border:#ECE7DE;
  --text:#2E2E3F;--text-soft:#5A5A70;--muted:#8E8EA0;
  --primary:#8899C4;--primary-hover:#7386B5;--primary-soft:#EDF0F8;--primary-ring:#DDE4F2;
  --peach:#F7DEC8;--mint:#D4E8DC;--lavender:#E0D7EE;--sky:#DAE4F2;--rose:#F5DCE2;--butter:#F5EBC8;--sage:#D8E6DC;
  --m-agama:#E8DCF0;--m-agama-i:#7E6BA5;
  --m-pancasila:#F5DFDC;--m-pancasila-i:#B7726A;
  --m-bindo:#DCE6F2;--m-bindo-i:#6B87B5;
  --m-bing:#D4E6E0;--m-bing-i:#5E8F84;
  --m-mtk:#F5E6D2;--m-mtk-i:#B58B5A;
  --m-seni:#F0DCE6;--m-seni-i:#A5708B;
  --m-pjok:#DCE8DA;--m-pjok-i:#6B8F62;
  --m-ipas:#DCE6DF;--m-ipas-i:#5F8F79;
  --m-tik:#E0E0F0;--m-tik-i:#7474A8;
  --m-jawa:#F0E8D4;--m-jawa-i:#A89454;
  --m-batik:#E8D8DE;--m-batik-i:#A8707E;
  --err:#B8707A;--ok:#6B8F62;
  --radius:14px;--radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(46,46,63,.04);
  --shadow:0 2px 10px rgba(46,46,63,.05);
  --shadow-md:0 6px 20px rgba(46,46,63,.08);
  --shadow-lg:0 12px 32px rgba(46,46,63,.10);
  --ease:cubic-bezier(.2,.8,.2,1);
}
[data-theme="dark"]{
  --bg:#1C1C28;--surface:#24242F;--surface-2:#2A2A38;--border:#35353F;
  --text:#ECEAF2;--text-soft:#B8B6C8;--muted:#8E8CA0;
  --primary:#98A8D0;--primary-hover:#A8B8DD;--primary-soft:#2E3245;--primary-ring:#3A4058;
  --m-agama:#3A3248;--m-agama-i:#B8A8D8;
  --m-pancasila:#48302E;--m-pancasila-i:#D8A8A0;
  --m-bindo:#2E3644;--m-bindo-i:#98B0D8;
  --m-bing:#2A3630;--m-bing-i:#98D0C0;
  --m-mtk:#3E3428;--m-mtk-i:#D8B890;
  --m-seni:#3E2E38;--m-seni-i:#D8A8C0;
  --m-pjok:#2E3A2A;--m-pjok-i:#A8D098;
  --m-ipas:#2E3830;--m-ipas-i:#98D0B8;
  --m-tik:#2E2E44;--m-tik-i:#A8A8D8;
  --m-jawa:#3A3428;--m-jawa-i:#D8C898;
  --m-batik:#3A2E32;--m-batik-i:#D8A0B0;
  --err:#E0A8B0;--ok:#A8D098;
  --shadow-sm:0 1px 2px rgba(0,0,0,.2);
  --shadow:0 2px 10px rgba(0,0,0,.25);
  --shadow-md:0 6px 20px rgba(0,0,0,.3);
  --shadow-lg:0 12px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100vh;transition:background .3s,color .3s;
  overflow-y:scroll;
}
svg{display:block}
.icon{width:20px;height:20px;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;fill:none;flex-shrink:0;contain:strict}
.icon-sm{width:16px;height:16px;stroke-width:2}
.icon-lg{width:28px;height:28px;stroke-width:1.5}
img{max-width:100%;display:block}
button{font-family:inherit}
input,select,textarea{font-family:inherit}

/* ============ TOPBAR ============ */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:1.5rem 1rem;position:relative;z-index:30}
.topbar-inner{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.9rem}
.brand-mark{width:48px;height:48px;border-radius:14px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex-shrink:0}
.brand-mark .icon{width:24px;height:24px;stroke-width:1.6}
.brand-text h1{font-size:1.15rem;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.brand-text p{font-size:.82rem;color:var(--muted);margin-top:.1rem}
.top-actions{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-soft);cursor:pointer;transition:all .2s var(--ease);-webkit-tap-highlight-color:transparent}
.btn-icon:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-ring)}
.btn-pill{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1rem;border-radius:10px;background:var(--primary-soft);border:1px solid var(--primary-ring);color:var(--primary);font-size:.86rem;font-weight:600;cursor:pointer;transition:all .2s var(--ease);text-decoration:none;-webkit-tap-highlight-color:transparent}
.btn-pill:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-pill.solid{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-pill.solid:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.user-menu{position:relative}
.user-trigger{display:inline-flex;align-items:center;gap:.5rem;padding:.35rem .75rem .35rem .35rem;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);cursor:pointer;transition:all .2s;font-size:.85rem;font-weight:600}
.user-trigger:hover{border-color:var(--primary-ring);background:var(--primary-soft)}
.user-av{width:26px;height:26px;border-radius:50%;background:var(--lavender);color:var(--m-agama-i);display:grid;place-items:center;font-size:.68rem;font-weight:800;letter-spacing:.02em}
.dropdown{position:absolute;top:calc(100% + .5rem);right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);min-width:220px;padding:.35rem;z-index:100;opacity:0;visibility:hidden;transform:translateY(-6px);transition:all .2s var(--ease)}
.dropdown.show{opacity:1;visibility:visible;transform:translateY(0)}
.dd-head{padding:.7rem .85rem;border-bottom:1px solid var(--border);margin-bottom:.3rem}
.dd-head strong{display:block;font-size:.9rem;color:var(--text)}
.dd-head .role{display:inline-block;margin-top:.25rem;font-size:.66rem;text-transform:uppercase;letter-spacing:.6px;background:var(--primary-soft);color:var(--primary);padding:.15rem .5rem;border-radius:999px;font-weight:700}
.dd-item{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;padding:.55rem .85rem;border-radius:8px;background:transparent;border:none;cursor:pointer;font-size:.86rem;color:var(--text);text-decoration:none;transition:background .15s}
.dd-item .icon{width:16px;height:16px;stroke-width:1.9}
.dd-item:hover{background:var(--primary-soft);color:var(--primary)}
.dd-item.danger{color:var(--err)}
.dd-item.danger:hover{background:#F5E0E4}
[data-theme="dark"] .dd-item.danger:hover{background:#3A2A32}

/* ============ STATS ============ */
.stats{max-width:1200px;margin:0 auto;padding:1.25rem 1rem 0;display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem 1rem;display:flex;align-items:center;gap:.75rem;transition:box-shadow .2s}
.stat:hover{box-shadow:var(--shadow-sm)}
.stat-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.stat-ic .icon{width:18px;height:18px;stroke-width:1.9}
.stat-ic.book{background:var(--sky);color:var(--m-bindo-i)}
.stat-ic.class{background:var(--lavender);color:var(--m-agama-i)}
.stat-ic.subject{background:var(--peach);color:var(--m-mtk-i)}
.stat-ic.teacher{background:var(--mint);color:var(--m-bing-i)}
.stat-val{font-size:1.35rem;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat-lbl{font-size:.72rem;color:var(--muted);margin-top:.2rem;font-weight:500}

/* ============ CONTROLS ============ */
.container{max-width:1200px;margin:0 auto;padding:1.25rem 1rem 3rem}
.controls{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.7rem;display:flex;gap:.55rem;flex-wrap:wrap;align-items:center;margin-bottom:1.25rem;box-shadow:var(--shadow-sm)}
.search{position:relative;flex:1 1 260px;min-width:200px}
.search input{width:100%;padding:.6rem .85rem .6rem 2.4rem;border:1.5px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text);font-size:.88rem;outline:none;transition:all .2s var(--ease)}
.search input:focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3px var(--primary-ring)}
.search input::placeholder{color:var(--muted)}
.search > .icon{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke-width:2;color:var(--muted);pointer-events:none}
.search-clear{position:absolute;right:.4rem;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:6px;border:none;background:transparent;color:var(--muted);cursor:pointer;display:none;align-items:center;justify-content:center}
.search-clear:hover{background:var(--surface-2);color:var(--text)}
.search.has-val .search-clear{display:flex}
.search-clear .icon{width:14px;height:14px;stroke-width:2.4}
.select{position:relative}
.select select{appearance:none;padding:.6rem 2rem .6rem .85rem;border:1.5px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text);font-size:.85rem;font-weight:500;outline:none;cursor:pointer;transition:all .2s var(--ease)}
.select select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring);background:var(--surface)}
.select > .icon{position:absolute;right:.7rem;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke-width:2.2;color:var(--muted);pointer-events:none}

/* ============ RESULT BAR ============ */
.result-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem;font-size:.82rem;color:var(--muted)}
.result-bar strong{color:var(--text);font-weight:700}
.chips{display:flex;gap:.35rem;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .6rem .25rem .75rem;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:.74rem;font-weight:600}
.chip button{background:transparent;border:none;cursor:pointer;color:inherit;padding:0;line-height:1;display:grid;place-items:center;width:16px;height:16px;border-radius:50%}
.chip button:hover{background:var(--primary);color:#fff}
.chip .icon{width:10px;height:10px;stroke-width:2.5}

/* ============ CLASS SECTION ============ */
.class-section{margin-bottom:2rem;content-visibility:auto;contain-intrinsic-size:600px}
.class-head{display:flex;align-items:center;gap:.7rem;margin-bottom:.9rem;padding-bottom:.6rem;border-bottom:1px solid var(--border)}
.class-num{width:36px;height:36px;border-radius:10px;background:var(--lavender);color:var(--m-agama-i);display:grid;place-items:center;font-weight:800;font-size:.95rem}
.class-head h2{font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.class-count{font-size:.72rem;color:var(--muted);font-weight:600;background:var(--surface-2);padding:.15rem .55rem;border-radius:999px}

/* ============ GRID ============ */
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s;animation:fadeIn .35s var(--ease) backwards;content-visibility:auto;contain-intrinsic-size:360px}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--primary-ring)}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;display:grid;place-items:center;background:var(--primary-soft)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;transition:transform .4s var(--ease)}
.card:hover .thumb img{transform:scale(1.04)}
.thumb-ic{color:var(--thumb-fg,var(--primary));opacity:.7}
.thumb-ic svg{width:52px;height:52px;stroke-width:1.2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:.6rem;left:.6rem;z-index:3;padding:.25rem .6rem;border-radius:8px;background:rgba(255,255,255,.95);color:var(--text-soft);font-size:.68rem;font-weight:700;letter-spacing:.02em;box-shadow:0 1px 3px rgba(46,46,63,.08);backdrop-filter:blur(6px)}
[data-theme="dark"] .badge{background:rgba(36,36,47,.92);color:var(--text-soft)}
.body{padding:1rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.card h3{font-size:.95rem;font-weight:700;line-height:1.35;letter-spacing:-.005em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card .desc{font-size:.82rem;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;gap:.45rem;font-size:.75rem;color:var(--muted);margin-top:auto;padding-top:.4rem}
.meta .av{width:22px;height:22px;border-radius:50%;background:var(--butter);color:var(--m-jawa-i);display:grid;place-items:center;font-size:.62rem;font-weight:800;flex-shrink:0}
.meta .name{color:var(--text-soft);font-weight:600}
.actions{display:flex;gap:.4rem;margin-top:.65rem;padding-top:.75rem;border-top:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.55rem .9rem;border-radius:9px;font-size:.83rem;font-weight:700;text-decoration:none;border:none;cursor:pointer;transition:all .2s var(--ease);-webkit-tap-highlight-color:transparent}
.btn-primary{flex:1;background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover)}
.btn-primary .icon{width:14px;height:14px;stroke-width:2.2}
.btn-ghost{flex:0 0 auto;padding:.55rem .7rem;background:var(--surface-2);color:var(--text-soft);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-ring)}
.btn-ghost .icon{width:15px;height:15px;stroke-width:2}

/* ============ LOAD MORE ============ */
.load-more-wrap{text-align:center;padding:2rem 0 1rem;display:none}
.load-more-wrap.show{display:block}
.btn-load-more{display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.5rem;border-radius:10px;background:var(--surface);border:1.5px solid var(--border);color:var(--text-soft);font-weight:700;font-size:.88rem;cursor:pointer;transition:all .2s var(--ease)}
.btn-load-more:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-ring);transform:translateY(-1px)}
.btn-load-more .icon{width:15px;height:15px;stroke-width:2.2}
.load-more-info{font-size:.78rem;color:var(--muted);margin-top:.6rem}

/* ============ SKELETON ============ */
.sk{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.sk-th{aspect-ratio:16/9;background:var(--surface-2);animation:pulse 1.6s ease-in-out infinite}
.sk-bd{padding:1rem;display:flex;flex-direction:column;gap:.55rem}
.sk-l{height:11px;border-radius:5px;background:var(--surface-2);animation:pulse 1.6s ease-in-out infinite}
.sk-l.a{width:55%}.sk-l.b{width:85%}.sk-l.c{width:70%}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ============ EMPTY ============ */
.empty{text-align:center;padding:3.5rem 1.5rem;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius)}
.empty-ic{width:64px;height:64px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin:0 auto 1rem}
.empty h3{font-size:1rem;font-weight:700;margin-bottom:.4rem}
.empty p{color:var(--muted);font-size:.86rem;margin-bottom:1.25rem}

/* ============ FOOTER ============ */
.footer{max-width:1200px;margin:0 auto;padding:2rem 1rem;border-top:1px solid var(--border);text-align:center;font-size:.8rem;color:var(--muted);line-height:1.6}
.footer strong{color:var(--text-soft);font-weight:700;display:block;margin-bottom:.15rem}

/* ============ TOAST ============ */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(120px);background:var(--text);color:var(--bg);padding:.7rem 1.15rem;border-radius:11px;font-size:.85rem;font-weight:600;box-shadow:var(--shadow-lg);z-index:999;transition:transform .3s var(--ease);max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ============ TO TOP ============ */
.to-top{position:fixed;bottom:1.25rem;right:1.25rem;width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text-soft);cursor:pointer;box-shadow:var(--shadow);display:grid;place-items:center;opacity:0;pointer-events:none;transform:translateY(20px);transition:all .3s var(--ease);z-index:99}
.to-top.show{opacity:1;pointer-events:auto;transform:translateY(0)}
.to-top:hover{color:var(--primary);border-color:var(--primary-ring);transform:translateY(-2px)}
.to-top .icon{width:18px;height:18px;stroke-width:2}

/* ============ RESPONSIVE ============ */
@media(max-width:768px){
  .stats{grid-template-columns:repeat(2,1fr);gap:.6rem;padding:1rem .85rem 0}
  .stat{padding:.75rem .85rem;gap:.6rem}
  .stat-ic{width:34px;height:34px}
  .stat-val{font-size:1.15rem}
}
@media(max-width:640px){
  .topbar{padding:1rem .85rem}
  .brand-mark{width:42px;height:42px}
  .brand-text h1{font-size:1rem}
  .brand-text p{font-size:.75rem}
  .top-actions{gap:.35rem}
  .btn-icon{width:34px;height:34px}
  .btn-pill{padding:.5rem .75rem;font-size:.8rem}
  .btn-pill .lbl{display:none}
  .container{padding:1rem .85rem 2.5rem}
  .grid{grid-template-columns:1fr}
  .class-num{width:32px;height:32px;font-size:.85rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}
</style>
</head>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">
        <svg class="icon" viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"/></svg>
      </div>
      <div class="brand-text">
        <h1>Rumah MPI</h1>
        <p>SD Negeri 1 Godegan</p>

    </div>

    <div class="top-actions">
      <a class="btn-pill solid" href="upload.html" id="addBtn" style="display:none">

        <span class="lbl">Tambah</span>
      </a>
      <a class="btn-pill" href="login.html" id="loginBtn">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5M15 12H3"/></svg>
        <span class="lbl">Masuk</span>

      <div class="user-menu" id="userMenu" style="display:none">
        <button class="user-trigger" id="userBtn" aria-haspopup="true">
          <span class="user-av" id="userAvatar">?</span>
          <span id="userName">User</span>
          <svg class="icon" style="width:12px;height:12px;stroke-width:2.4;opacity:.6" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="dropdown" id="dropdown">
          <div class="dd-head">
            <strong id="dropName">User</strong>
            <span class="role" id="dropRole">guru</span>

<script>
/* ============================================================
   KONFIGURASI
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbxQ7Ve-VLGJIYqJqxHJEfJnnpeq_rw3cGs-LlmRqD81md_GMtPx4H44r6QptEkfF2QGRg/exec";

const CFG = {
  PAGE_SIZE: 24,           // jumlah kartu per "halaman"
  CACHE_TTL: 60,           // detik — client cache
  DEBOUNCE_SEARCH: 150,    // ms
  PREFETCH_DELAY: 80       // ms — delay hover sebelum prefetch
};

/* ============================================================
   AUTH
   ============================================================ */
const Auth = {
  KEY: 'mpi_auth_v3',
  get() { try { return JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch { return null; } },
  clear() { localStorage.removeItem(this.KEY); },
  isValid() { const a = this.get(); return !!(a && a.username && a.pin); }
};

/* ============================================================
   MEMORY CACHE (per-execution, gratis)
   ============================================================ */
const MemCache = {
  _m: new Map(),
  get(k) { return this._m.get(k); },
  set(k, v) { this._m.set(k, v); },
  del(k) { this._m.delete(k); },
  clear() { this._m.clear(); }
};

/* ============================================================
   CLIENT CACHE (localStorage, TTL)
   ============================================================ */
const LocalCache = {
  PREFIX: 'mpi_c_v4_',
  get(k, ttlSec) {
    const mem = MemCache.get('lc_' + k);
    if (mem) return mem;
    try {
      const raw = localStorage.getItem(this.PREFIX + k);
      if (!raw) return null;
      const o = JSON.parse(raw);
      if (ttlSec && (Date.now() - o.t > ttlSec * 1000)) {
        localStorage.removeItem(this.PREFIX + k);
        return null;
      }
      MemCache.set('lc_' + k, o.d);
      return o.d;
    } catch { return null; }
  },
  set(k, d) {
    MemCache.set('lc_' + k, d);
    try { localStorage.setItem(this.PREFIX + k, JSON.stringify({ t: Date.now(), d })); } catch {}
  },
  del(k) { MemCache.del('lc_' + k); localStorage.removeItem(this.PREFIX + k); },
  clear() {
    MemCache.clear();
    try {
      Object.keys(localStorage)
        .filter(k => k.startsWith(this.PREFIX))
        .forEach(k => localStorage.removeItem(k));
    } catch {}
  }
};

/* ============================================================
   API — dengan dedup, abort, dan timeout
   ============================================================ */
const API = {
  _inflight: new Map(),
  _controller: null,

  async get(params, opts = {}) {
    const key = JSON.stringify(params);
    // Reuse request yang sedang jalan (dedup)
    if (this._inflight.has(key)) return this._inflight.get(key);

    // Abort request lama kalau ada
    if (opts.abortPrevious && this._controller) {
      try { this._controller.abort(); } catch {}
    }
    this._controller = new AbortController();
    const signal = this._controller.signal;

    const qs = new URLSearchParams(params).toString();
    const promise = (async () => {
      const res = await fetch(`${API_URL}?${qs}`, { cache: 'no-store', signal });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      if (json.error) throw new Error(json.error);
      return json;
    })().finally(() => this._inflight.delete(key));

    this._inflight.set(key, promise);
    return promise;
  }
};

/* ============================================================
   HELPERS
   ============================================================ */
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function debounce(fn, ms) {
  let t;
  return function(...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  };
}

let _toastT;
function toast(msg, ms = 2200) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => el.classList.remove('show'), ms);
}

/* ============================================================
   MAPEL META
   ============================================================ */
const MAPEL_META = [
  { keys:['agama'],                       short:'Agama',      bg:'--m-agama',     fg:'--m-agama-i',     svg:'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>' },
  { keys:['pancasila'],                   short:'Pancasila',  bg:'--m-pancasila', fg:'--m-pancasila-i', svg:'<path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/>' },
  { keys:['bahasa indonesia'],            short:'B. Indonesia',bg:'--m-bindo',    fg:'--m-bindo-i',     svg:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>' },
  { keys:['bahasa inggris'],              short:'B. Inggris', bg:'--m-bing',      fg:'--m-bing-i',      svg:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>' },
  { keys:['matematika'],                  short:'Matematika', bg:'--m-mtk',       fg:'--m-mtk-i',       svg:'<rect width="16" height="20" x="4" y="2" rx="2"/><path d="M8 6h8M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>' },
  { keys:['seni'],                        short:'Seni Budaya',bg:'--m-seni',      fg:'--m-seni-i',      svg:'<circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.8-.15 2.6-.4a2.5 2.5 0 0 0 .9-4.5 2.5 2.5 0 0 1 1.5-4.6h2c2.2 0 4-1.8 4-4 0-3.9-5.4-6.5-10-6.5z"/>' },
  { keys:['pjok','jasmani'],              short:'PJOK',       bg:'--m-pjok',      fg:'--m-pjok-i',      svg:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>' },
  { keys:['ipas','alam'],                 short:'IPAS',       bg:'--m-ipas',      fg:'--m-ipas-i',      svg:'<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/>' },
  { keys:['tik','informasi'],             short:'TIK',        bg:'--m-tik',       fg:'--m-tik-i',       svg:'<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/>' },
  { keys:['jawa'],                        short:'B. Jawa',    bg:'--m-jawa',      fg:'--m-jawa-i',      svg:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>' },
  { keys:['membatik','batik'],            short:'Membatik',   bg:'--m-batik',     fg:'--m-batik-i',     svg:'<path d="m9.06 11.9 8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/>' }
];
const MAPEL_DEFAULT = { short:'Mapel', bg:'--primary-soft', fg:'--primary', svg:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>' };

function getMapelMeta(m) {
  const x = (m || '').toLowerCase();
  for (let i = 0; i < MAPEL_META.length; i++) {
    const meta = MAPEL_META[i];
    for (let j = 0; j < meta.keys.length; j++) {
      if (x.indexOf(meta.keys[j]) !== -1) return meta;
    }
  }
  return MAPEL_DEFAULT;
}

/* ============================================================
   THEME
   ============================================================ */
const Theme = {
  KEY: 'mpi_theme',
  current() { return document.documentElement.getAttribute('data-theme') || 'light'; },
  toggle() {
    const next = this.current() === 'dark' ? 'light' : 'dark';
    this.apply(next);
  },
  apply(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem(this.KEY, t); } catch {}
    const ic = $('themeIcon');
    if (ic) ic.innerHTML = t === 'dark'
      ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>'
      : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }
};

/* ============================================================
   URL STATE (shareable filter)
   ============================================================ */
const UrlState = {
  read() {
    const p = new URLSearchParams(location.search);
    return {
      q: p.get('q') || '',
      k: p.get('k') || '',
      m: p.get('m') || '',
      s: p.get('s') || 'kelas'
    };
  },
  write(state) {
    const p = new URLSearchParams();
    if (state.q) p.set('q', state.q);
    if (state.k) p.set('k', state.k);
    if (state.m) p.set('m', state.m);
    if (state.s && state.s !== 'kelas') p.set('s', state.s);
    const qs = p.toString();
    const url = qs ? `${location.pathname}?${qs}` : location.pathname;
    try { history.replaceState(null, '', url); } catch {}
  }
};

/* ============================================================
   STATE
   ============================================================ */
const state = {
  all: [],
  filtered: [],
  rendered: 0,
  version: 0,
  initialUrl: UrlState.read()
};

/* ============================================================
   DOM REFS
   ============================================================ */
const el = {
  content: $('content'),
  resultMeta: $('resultMeta'),
  search: $('search'),
  searchWrap: $('searchWrap'),
  clearSearch: $('clearSearch'),
  filterKelas: $('filterKelas'),
  filterMapel: $('filterMapel'),
  sortBy: $('sortBy'),
  countShown: $('countShown'),
  countTotal: $('countTotal'),
  activeChips: $('activeChips'),
  loadMoreWrap: $('loadMoreWrap'),
  loadMoreBtn: $('loadMoreBtn'),
  loadMoreInfo: $('loadMoreInfo'),
  toTop: $('toTop')
};

/* ============================================================
   LOAD DATA
   ============================================================ */
async function loadData(force = false) {
  // 1. Coba local cache dulu
  if (!force) {
    const cached = LocalCache.get('mpi_list', CFG.CACHE_TTL);
    if (cached && cached.data) {
      state.all = cached.data;
      state.version = cached.version || 0;
      afterData();
      silentRefresh();
      return;
    }
  }

  // 2. Skeleton loading
  if (!state.all.length) showSkeleton();

  try {
    const params = { action: 'list', limit: 2000 };
    if (!force && state.version) params.version = state.version;

    const res = await API.get(params, { abortPrevious: true });

    // 3. Server bilang tidak ada perubahan
    if (res.unchanged) {
      const fallback = LocalCache.get('mpi_list', 99999);
      if (fallback && fallback.data) {
        state.all = fallback.data;
        state.version = fallback.version || 0;
        afterData();
        return;
      }
    }

    state.all = res.data || [];
    state.version = res.version || 0;
    LocalCache.set('mpi_list', { data: state.all, version: state.version });
    afterData();
  } catch (err) {
    if (err.name === 'AbortError') return;
    showError(err.message);
  }
}

/* Silent refresh — cek update di background */
async function silentRefresh() {
  try {
    const res = await API.get({
      action: 'list', limit: 2000, version: state.version
    });
    if (res.unchanged) return;
    state.all = res.data || [];
    state.version = res.version || 0;
    LocalCache.set('mpi_list', { data: state.all, version: state.version });
    afterData();
    toast('Data diperbarui');
  } catch (e) {}
}

/* ============================================================
   AFTER DATA — build filters, render
   ============================================================ */
function afterData() {
  buildFilters();
  applyUrlState();
  recompute();
  render(0);
}

function applyUrlState() {
  const s = state.initialUrl;
  if (s.q) { el.search.value = s.q; el.searchWrap.classList.add('has-val'); }
  if (s.k) el.filterKelas.value = s.k;
  if (s.m) el.filterMapel.value = s.m;
  if (s.s) el.sortBy.value = s.s;
}

function buildFilters() {
  const cK = el.filterKelas.value;
  const cM = el.filterMapel.value;
  el.filterKelas.length = 1;
  el.filterMapel.length = 1;

  const ks = new Set(), ms = new Set(), gs = new Set();
  for (let i = 0; i < state.all.length; i++) {
    const r = state.all[i];
    if (r.k) ks.add(r.k);
    if (r.m) ms.add(r.m);
    if (r.g) gs.add(r.g);
  }

  // Batch DOM insert via DocumentFragment
  const fragK = document.createDocumentFragment();
  [...ks].sort((a, b) => a.localeCompare(b, 'id', { numeric: true })).forEach(k => {
    const o = document.createElement('option');
    o.value = k; o.textContent = 'Kelas ' + k;
    fragK.appendChild(o);
  });
  el.filterKelas.appendChild(fragK);

  const fragM = document.createDocumentFragment();
  [...ms].sort().forEach(m => {
    const o = document.createElement('option');
    o.value = m; o.textContent = getMapelMeta(m).short;
    fragM.appendChild(o);
  });
  el.filterMapel.appendChild(fragM);

  el.filterKelas.value = cK;
  el.filterMapel.value = cM;

  animateNum('statTotal', state.all.length);
  animateNum('statKelas', ks.size);
  animateNum('statMapel', ms.size);
  animateNum('statGuru', gs.size);
}

function animateNum(id, target) {
  const node = $(id);
  const start = parseInt(node.textContent) || 0;
  if (start === target) return;
  const t0 = performance.now();
  const dur = 400;
  function step(now) {
    const p = Math.min((now - t0) / dur, 1);
    const e = 1 - Math.pow(1 - p, 3);
    node.textContent = Math.round(start + (target - start) * e);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ============================================================
   FILTER + SORT
   ============================================================ */
function recompute() {
  const q = el.search.value.toLowerCase().trim();
  const kf = el.filterKelas.value;
  const mf = el.filterMapel.value;
  const sort = el.sortBy.value;

  const out = [];
  for (let i = 0; i < state.all.length; i++) {
    const r = state.all[i];
    if (kf && r.k !== kf) continue;
    if (mf && r.m !== mf) continue;
    if (q) {
      const t = (r.j + ' ' + r.m + ' ' + r.g + ' ' + r.d).toLowerCase();
      if (t.indexOf(q) === -1) continue;
    }
    out.push(r);
  }

  if (sort === 'judul') {
    out.sort((a, b) => a.j.localeCompare(b.j, 'id'));
  } else if (sort === 'guru') {
    out.sort((a, b) => a.g.localeCompare(b.g, 'id'));
  } else if (sort === 'terbaru') {
    out.sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));
  } else {
    out.sort((a, b) => {
      const c = String(a.k).localeCompare(String(b.k), 'id', { numeric: true });
      return c !== 0 ? c : a.j.localeCompare(b.j, 'id');
    });
  }

  state.filtered = out;
}

/* ============================================================
   RENDER
   ============================================================ */
function render(fromIndex) {
  const total = state.filtered.length;

  el.countShown.textContent = total;
  el.countTotal.textContent = state.all.length;
  el.resultMeta.style.display = 'flex';
  renderChips();

  if (!total) {
    el.content.innerHTML = `
      <div class="empty">
        <div class="empty-ic">
          <svg class="icon icon-lg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <h3>Belum ada MPI di sini</h3>
        <p>Coba ubah kata kunci atau filter.</p>
        <button class="btn btn-primary" style="flex:0 0 auto;padding:.7rem 1.4rem;margin:0 auto" onclick="resetFilters()">Hapus Filter</button>
      </div>`;
    el.loadMoreWrap.classList.remove('show');
    return;
  }

  if (fromIndex === 0) el.content.innerHTML = '';

  const end = Math.min(fromIndex + CFG.PAGE_SIZE, total);
  const slice = state.filtered.slice(fromIndex, end);
  const sort = el.sortBy.value;
  const useGroup = sort === 'kelas' && !el.filterKelas.value;

  // Batch render — 1x innerHTML untuk potongan ini
  let html = '';

  if (useGroup) {
    // Group by kelas
    const grouped = {};
    const order = [];
    for (let i = 0; i < slice.length; i++) {
      const r = slice[i];
      const k = r.k || 'Lainnya';
      if (!grouped[k]) { grouped[k] = []; order.push(k); }
      grouped[k].push(r);
    }

    for (let i = 0; i < order.length; i++) {
      const k = order[i];
      const items = grouped[k];
      html += `<section class="class-section">
        <div class="class-head">
          <div class="class-num">${esc(k)}</div>
          <h2>Kelas ${esc(k)}</h2>
          <span class="class-count">${items.length} MPI</span>
        </div>
        <div class="grid">`;
      for (let j = 0; j < items.length; j++) html += cardHTML(items[j], j);
      html += `</div></section>`;
    }
  } else {
    html = '<div class="grid">';
    for (let i = 0; i < slice.length; i++) html += cardHTML(slice[i], i);
    html += '</div>';
  }

  if (fromIndex === 0) {
    el.content.innerHTML = html;
  } else {
    el.content.insertAdjacentHTML('beforeend', html);
  }

  state.rendered = end;

  // Load more button
  if (end < total) {
    el.loadMoreWrap.classList.add('show');
    el.loadMoreInfo.textContent = `Menampilkan ${end} dari ${total} MPI`;
  } else {
    el.loadMoreWrap.classList.remove('show');
  }
}

function cardHTML(r, i) {
  const delay = Math.min(i * 20, 300);
  const thumb = r.t || '';
  const meta = getMapelMeta(r.m);
  const initials = r.g
    ? r.g.split(' ').filter(w => /^[A-Z]/i.test(w[0])).slice(0, 2).map(w => w[0]).join('').toUpperCase()
    : '?';

  const thumbHTML = thumb
    ? `<img src="${esc(thumb)}" alt="" loading="lazy" decoding="async" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
       <div class="thumb-ic" style="display:none"><svg viewBox="0 0 24 24">${meta.svg}</svg></div>`
    : `<div class="thumb-ic"><svg viewBox="0 0 24 24">${meta.svg}</svg></div>`;

  const thumbStyle = thumb ? '' : `style="background:var(${meta.bg});--thumb-fg:var(${meta.fg})"`;
  const vUrl = `viewer.html?file=${encodeURIComponent(r.l)}&title=${encodeURIComponent(r.j)}&guru=${encodeURIComponent(r.g)}`;

  return `<article class="card" style="animation-delay:${delay}ms" data-link="${esc(r.l)}" data-title="${esc(r.j)}" data-guru="${esc(r.g)}">
    <div class="thumb" ${thumbStyle}>
      ${thumbHTML}
      ${r.m ? `<div class="badge">${esc(meta.short)}</div>` : ''}
    </div>
    <div class="body">
      <h3>${esc(r.j)}</h3>
      ${r.d ? `<p class="desc">${esc(r.d)}</p>` : ''}
      <div class="meta">
        <span class="av">${esc(initials)}</span>
        <span class="name">${esc(r.g || '-')}</span>
      </div>
      <div class="actions">
        <a class="btn btn-primary" href="${vUrl}" data-prefetch>
          <svg class="icon" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
          Buka MPI
        </a>
        <button class="btn btn-ghost" data-action="share" data-link="${esc(r.l)}" data-title="${esc(r.j)}" data-guru="${esc(r.g)}" title="Bagikan">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
        </button>
      </div>
    </div>
  </article>`;
}

function renderChips() {
  const q = el.search.value.trim();
  const kf = el.filterKelas.value;
  const mf = el.filterMapel.value;
  const X = '<svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  const parts = [];
  if (kf) parts.push(`<span class="chip">Kelas ${esc(kf)} <button data-clear="k">${X}</button></span>`);
  if (mf) parts.push(`<span class="chip">${esc(getMapelMeta(mf).short)} <button data-clear="m">${X}</button></span>`);
  if (q) parts.push(`<span class="chip">"${esc(q)}" <button data-clear="q">${X}</button></span>`);
  el.activeChips.innerHTML = parts.join('');
}

function showSkeleton() {
  el.content.innerHTML = `<div class="grid">
    <div class="sk"><div class="sk-th"></div><div class="sk-bd"><div class="sk-l a"></div><div class="sk-l b"></div><div class="sk-l c"></div></div></div>
    <div class="sk"><div class="sk-th"></div><div class="sk-bd"><div class="sk-l a"></div><div class="sk-l b"></div><div class="sk-l c"></div></div></div>
    <div class="sk"><div class="sk-th"></div><div class="sk-bd"><div class="sk-l a"></div><div class="sk-l b"></div><div class="sk-l c"></div></div></div>
  </div>`;
  el.resultMeta.style.display = 'none';
}

function showError(msg) {
  el.content.innerHTML = `<div class="empty">
    <div class="empty-ic"><svg class="icon icon-lg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg></div>
    <h3>Rumah MPI tidak dapat dimuat</h3>
    <p>${esc(msg)}</p>
    <button class="btn btn-primary" style="flex:0 0 auto;padding:.7rem 1.4rem;margin:0 auto" data-action="retry">Coba Lagi</button>
  </div>`;
}

/* ============================================================
   SHARE
   ============================================================ */
async function shareMPI(link, judul, guru) {
  const u = new URL('viewer.html', location.href);
  u.searchParams.set('file', link);
  u.searchParams.set('title', judul);
  u.searchParams.set('guru', guru || '');
  const text = `Coba MPI ini: ${judul}\n${guru || '-'} — SD Negeri 1 Godegan\n${u.href}`;
  if (navigator.share) {
    try { await navigator.share({ title: judul, text, url: u.href }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}

/* ============================================================
   EVENT DELEGATION — 1 listener untuk semua
   ============================================================ */
document.addEventListener('click', e => {
  // Clear chip
  const chipClear = e.target.closest('[data-clear]');
  if (chipClear) {
    const t = chipClear.dataset.clear;
    if (t === 'k') el.filterKelas.value = '';
    if (t === 'm') el.filterMapel.value = '';
    if (t === 'q') { el.search.value = ''; el.searchWrap.classList.remove('has-val'); }
    refresh();
    return;
  }

  // Share button
  const shareBtn = e.target.closest('[data-action="share"]');
  if (shareBtn) {
    shareMPI(shareBtn.dataset.link, shareBtn.dataset.title, shareBtn.dataset.guru);
    return;
  }

  // Retry
  if (e.target.closest('[data-action="retry"]')) {
    loadData(true);
    return;
  }

  // Dropdown toggle user
  if (e.target.closest('#userBtn')) {
    e.stopPropagation();
    $('dropdown').classList.toggle('show');
    return;
  }
  if (!e.target.closest('.user-menu')) {
    $('dropdown')?.classList.remove('show');
  }
});

/* ============================================================
   PREFETCH on hover (dengan delay)
   ============================================================ */
let _prefetchTimers = new WeakMap();
document.addEventListener('mouseover', e => {
  const a = e.target.closest('a[href*="viewer.html"]');
  if (!a) return;
  const t = setTimeout(() => {
    const link = document.createElement('link');
    link.rel = 'prefetch';
    link.href = a.href;
    document.head.appendChild(link);
  }, CFG.PREFETCH_DELAY);
  _prefetchTimers.set(a, t);
});
document.addEventListener('mouseout', e => {
  const a = e.target.closest('a[href*="viewer.html"]');
  if (!a) return;
  const t = _prefetchTimers.get(a);
  if (t) clearTimeout(t);
});

/* ============================================================
   REFRESH (filter/sort/search berubah)
   ============================================================ */
const refresh = () => {
  recompute();
  render(0);
  UrlState.write({
    q: el.search.value.trim(),
    k: el.filterKelas.value,
    m: el.filterMapel.value,
    s: el.sortBy.value
  });
};

window.resetFilters = () => {
  el.search.value = '';
  el.filterKelas.value = '';
  el.filterMapel.value = '';
  el.sortBy.value = 'kelas';
  el.searchWrap.classList.remove('has-val');
  refresh();
};

/* ============================================================
   INPUT LISTENERS
   ============================================================ */
el.search.addEventListener('input', debounce(() => {
  el.searchWrap.classList.toggle('has-val', el.search.value.length > 0);
  refresh();
}, CFG.DEBOUNCE_SEARCH));

el.clearSearch.addEventListener('click', () => {
  el.search.value = '';
  el.searchWrap.classList.remove('has-val');
  refresh();
  el.search.focus();
});

el.filterKelas.addEventListener('change', refresh);
el.filterMapel.addEventListener('change', refresh);
el.sortBy.addEventListener('change', refresh);

$('refreshBtn').addEventListener('click', () => {
  LocalCache.del('mpi_list');
  state.version = 0;
  state.all = [];
  loadData(true);
  toast('Memuat ulang...');
});

$('themeToggle').addEventListener('click', () => Theme.toggle());

$('logoutBtn')?.addEventListener('click', () => {
  Auth.clear();
  LocalCache.clear();
  toast('Berhasil keluar');
  setTimeout(() => location.reload(), 400);
});

el.loadMoreBtn.addEventListener('click', () => render(state.rendered));

/* ============================================================
   SCROLL & KEYBOARD
   ============================================================ */
let _scrollRAF;
window.addEventListener('scroll', () => {
  if (_scrollRAF) return;
  _scrollRAF = requestAnimationFrame(() => {
    el.toTop.classList.toggle('show', window.scrollY > 400);
    _scrollRAF = null;
  });
}, { passive: true });

el.toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    el.search.focus();
    el.search.select();
  }
  if (e.key === 'Escape') {
    $('dropdown')?.classList.remove('show');
  }
});

/* ============================================================
   AUTH UI
   ============================================================ */
function refreshAuthUI() {
  const a = Auth.get();
  const loginBtn = $('loginBtn'), addBtn = $('addBtn'), userMenu = $('userMenu');
  if (!a) {
    loginBtn.style.display = '';
    addBtn.style.display = 'none';
    userMenu.style.display = 'none';
    return;
  }
  const u = a.user || {};
  const initials = (u.nama || '?').split(' ').filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
  loginBtn.style.display = 'none';
  addBtn.style.display = '';
  userMenu.style.display = '';
  $('userAvatar').textContent = initials || '?';
  $('userName').textContent = (u.nama || '').split(' ')[0] || 'User';
  $('dropName').textContent = u.nama || 'User';
  $('dropRole').textContent = (u.role || 'guru') + (u.kelas && u.kelas !== '-' ? ' · Kelas ' + u.kelas : '');
}

/* ============================================================
   VISIBILITY — silent refresh saat kembali ke tab
   ============================================================ */
let _lastHidden = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    _lastHidden = Date.now();
  } else if (_lastHidden && Date.now() - _lastHidden > 60000) {
    silentRefresh();
  }
});

/* ============================================================
   START
   ============================================================ */
Theme.apply(Theme.current());
refreshAuthUI();
loadData();

// Expose untuk console debug
window.__mpi = { state, loadData, refresh };
</script>
</body>
</html>
