<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Memuat MPI...</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">

<script>
(function(){
  try{
    var t = localStorage.getItem('mpi_theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>

<style>
:root{
  --bg:#FAF8F5;--surface:#FFFFFF;--surface-2:#F5F2EC;--border:#ECE7DE;
  --text:#2E2E3F;--text-soft:#5A5A70;--muted:#8E8EA0;
  --primary:#8899C4;--primary-hover:#7386B5;--primary-soft:#EDF0F8;--primary-ring:#DDE4F2;
  --shadow:0 2px 10px rgba(46,46,63,.05);
  --shadow-lg:0 12px 32px rgba(46,46,63,.10);
  --ease:cubic-bezier(.2,.8,.2,1);
  --header-h:56px;--footer-h:52px;
}
[data-theme="dark"]{
  --bg:#1C1C28;--surface:#24242F;--surface-2:#2A2A38;--border:#35353F;
  --text:#ECEAF2;--text-soft:#B8B6C8;--muted:#8E8CA0;
  --primary:#98A8D0;--primary-hover:#A8B8DD;--primary-soft:#2E3245;--primary-ring:#3A4058;
  --shadow:0 2px 10px rgba(0,0,0,.25);
  --shadow-lg:0 12px 32px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
  transition:background .3s,color .3s;
}
svg{display:block}
.icon{width:18px;height:18px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;flex-shrink:0}
button{font-family:inherit}

/* ===== HEADER ===== */
.vh{
  height:var(--header-h);flex-shrink:0;
  background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.5rem;
  padding:0 .75rem;z-index:10;
}
.vh-back{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.5rem .75rem;border-radius:9px;
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--text-soft);font-size:.83rem;font-weight:600;
  text-decoration:none;transition:all .2s var(--ease);
  white-space:nowrap;flex-shrink:0;cursor:pointer;
}
.vh-back:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-ring)}
.vh-back .icon{width:15px;height:15px;stroke-width:2.2}

.vh-title{
  flex:1;min-width:0;
  display:flex;flex-direction:column;
  justify-content:center;
  line-height:1.4;
  padding:.15rem .25rem;
}
.vh-title .label{
  font-size:.6rem;color:var(--muted);
  text-transform:uppercase;letter-spacing:.6px;font-weight:600;
  line-height:1.2;
}
.vh-title .judul{
  font-size:.9rem;font-weight:700;letter-spacing:-.005em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.35;
  padding-bottom:.05em;
}

.vh-actions{display:flex;gap:.3rem;flex-shrink:0}
.vh-btn{
  width:36px;height:36px;border-radius:9px;
  display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--border);
  color:var(--text-soft);cursor:pointer;transition:all .2s var(--ease);
}
.vh-btn:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-ring)}

/* ===== FRAME ===== */
.vframe{flex:1;position:relative;background:var(--surface);overflow:hidden}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:block;background:var(--surface)}

/* ===== LOADING ===== */
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);z-index:5;transition:opacity .3s}
.loading.hide{opacity:0;pointer-events:none}
.spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .85s linear infinite;margin:0 auto .85rem}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:.85rem;color:var(--muted);text-align:center}

/* ===== ERROR ===== */
.error{position:absolute;inset:0;display:grid;place-items:center;padding:1.5rem;background:var(--bg);z-index:6}
.error.hidden{display:none}
.empty{text-align:center;padding:2.5rem 1.75rem;max-width:400px;background:var(--surface);border:1px dashed var(--border);border-radius:14px}
.empty-ic{width:56px;height:56px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin:0 auto 1rem}
.empty h3{font-size:1rem;font-weight:700;margin-bottom:.4rem}
.empty p{color:var(--muted);font-size:.85rem;margin-bottom:1.25rem;line-height:1.5}
.empty code{background:var(--surface-2);padding:.15rem .4rem;border-radius:4px;font-size:.8rem;color:var(--text-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.65rem 1.25rem;border-radius:9px;background:var(--primary);color:#fff;font-size:.86rem;font-weight:700;text-decoration:none;border:none;cursor:pointer;transition:all .2s var(--ease)}
.btn:hover{background:var(--primary-hover)}
.btn .icon{width:15px;height:15px;stroke-width:2.2}

/* ===== FOOTER ===== */
.vf{
  height:var(--footer-h);flex-shrink:0;
  background:var(--surface);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;gap:.4rem;
  padding:0 1rem;font-size:.78rem;color:var(--muted);
  text-align:center;line-height:1.3;
}
.vf .author{color:var(--text-soft);font-weight:700}
.vf .school{color:var(--primary);font-weight:600}
.vf .dot{color:var(--border)}

/* ===== FULLSCREEN EXIT ===== */
.fs-exit{
  position:fixed;top:1rem;right:1rem;z-index:9999;
  display:none;align-items:center;justify-content:center;
  width:38px;height:38px;
  border-radius:50%;
  border:none;cursor:pointer;
  background:rgba(46,46,63,.5);color:#fff;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:0 4px 12px rgba(0,0,0,.18);
  opacity:0;visibility:hidden;
  transform:scale(.85);
  transition:opacity .3s var(--ease),transform .3s var(--ease),background .2s var(--ease),visibility .3s;
  pointer-events:none;
}
.fs-exit.show{
  opacity:.65;visibility:visible;
  transform:scale(1);pointer-events:auto;
  animation:fsIn .4s var(--ease);
}
.fs-exit.show:hover{opacity:1;background:rgba(46,46,63,.9);transform:scale(1.08)}
.fs-exit:active{transform:scale(.95)}
.fs-exit .icon{width:16px;height:16px;stroke-width:2.4}
@keyframes fsIn{from{opacity:0;transform:scale(.85)}to{opacity:.65;transform:scale(1)}}
[data-theme="dark"] .fs-exit{background:rgba(236,234,242,.55);color:#1C1C28}
[data-theme="dark"] .fs-exit.show:hover{background:rgba(236,234,242,.95)}

/* Pseudo-fullscreen fallback (iOS) */
body.pseudo-fs .vh,
body.pseudo-fs .vf{display:none}

@media(max-width:560px){
  :root{--header-h:52px;--footer-h:48px}
  .vh .text{display:none}
  .vh-back{padding:.5rem .65rem}
  .vh-title .judul{font-size:.85rem}
  .vf{font-size:.72rem;padding:0 .6rem}
  .fs-exit{top:.6rem;right:.6rem;width:34px;height:34px}
  .fs-exit .icon{width:14px;height:14px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<header class="vh">
  <a class="vh-back" href="index.html" title="Kembali ke Rumah MPI">
    <svg class="icon" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
    <span class="text">Rumah MPI</span>
  </a>

  <div class="vh-title">
    <span class="label">Multimedia Pembelajaran</span>
    <span class="judul" id="mpiTitle">Memuat...</span>
  </div>

  <div class="vh-actions">
    <button class="vh-btn" id="reloadBtn" title="Muat ulang" aria-label="Muat ulang">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-9-9 9 9 0 0 1 9-9c2.5 0 4.8 1 6.5 2.6L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
    <button class="vh-btn" id="fsBtn" title="Layar penuh" aria-label="Layar penuh">
      <svg class="icon" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
  </div>
</header>

<div class="vframe">
  <div class="loading" id="loading">
    <div>
      <div class="spinner"></div>
      <div class="loading-text">Memuat MPI...</div>
    </div>
  </div>

  <div class="error hidden" id="errorBox">
    <div class="empty">
      <div class="empty-ic">
        <svg class="icon" style="width:28px;height:28px;stroke-width:1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      </div>
      <h3>MPI tidak dapat dimuat</h3>
      <p id="errorMsg">File tidak ditemukan atau rusak.</p>
      <a class="btn" href="index.html">
        <svg class="icon" viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
        Kembali ke Rumah MPI
      </a>
    </div>
  </div>

  <iframe id="mpiFrame" src="" allow="autoplay; fullscreen; clipboard-write" allowfullscreen referrerpolicy="no-referrer-when-downgrade" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads allow-top-navigation-by-user-activation"></iframe>
</div>

<footer class="vf">
  <span>Dibuat oleh&nbsp;<span class="author" id="footerGuru">Guru</span></span>
  <span class="dot">·</span>
  <span class="school">SD Negeri 1 Godegan</span>
</footer>

<button class="fs-exit" id="fsExit" aria-label="Keluar layar penuh" title="Keluar layar penuh">
  <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
</button>

<script>
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

const params = new URLSearchParams(location.search);
const fileUrl = params.get('file') || '';
const titleIn = params.get('title') || 'MPI';
const guruIn = params.get('guru') || 'Guru SD Negeri 1 Godegan';

const frame = document.getElementById('mpiFrame');
const loading = document.getElementById('loading');
const errorBox = document.getElementById('errorBox');
const errorMsg = document.getElementById('errorMsg');
const mpiTitle = document.getElementById('mpiTitle');
const fsExitBtn = document.getElementById('fsExit');

document.title = titleIn + ' · Rumah MPI SDN 1 Godegan';
mpiTitle.textContent = titleIn;
document.getElementById('footerGuru').textContent = guruIn;

function showError(msg) {
  loading.classList.add('hide');
  errorMsg.innerHTML = msg;
  errorBox.classList.remove('hidden');
}

if (!fileUrl) {
  showError('Parameter file tidak ditemukan.');
} else {
  const sep = fileUrl.includes('?') ? '&' : '?';
  frame.src = fileUrl + sep + '_viewer=1';

  const guard = setTimeout(() => {
    if (!loading.classList.contains('hide')) {
      showError('File terlalu lama dimuat: <code>' + esc(fileUrl) + '</code>');
    }
  }, 15000);

  frame.addEventListener('load', () => {
    clearTimeout(guard);
    loading.classList.add('hide');
    errorBox.classList.add('hidden');
    try {
      const t = frame.contentDocument?.title;
      if (t && t !== titleIn) {
        document.title = t + ' · Rumah MPI SDN 1 Godegan';
        mpiTitle.textContent = t;
      }
    } catch (e) {}

    try {
      const iframeDoc = frame.contentDocument || frame.contentWindow.document;
      ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => {
        iframeDoc.addEventListener(ev, () => {
          const isFs = !!(iframeDoc.fullscreenElement || iframeDoc.webkitFullscreenElement);
          if (isFs) FS.showExit();
          else FS.updateButton();
        });
      });
    } catch (e) {}
  });

  frame.addEventListener('error', () => {
    clearTimeout(guard);
    showError('File tidak dapat dimuat.');
  });
}

const FS = {
  _hideTimer: null,
  _idleMs: 3000,

  isActive() {
    return !!(
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.mozFullScreenElement ||
      document.msFullscreenElement ||
      document.body.classList.contains('pseudo-fs')
    );
  },

  enter() {
    const el = document.documentElement;
    const req = el.requestFullscreen ||
                el.webkitRequestFullscreen ||
                el.webkitRequestFullScreen ||
                el.mozRequestFullScreen ||
                el.msRequestFullscreen;
    if (req) {
      try {
        const p = req.call(el);
        if (p && typeof p.then === 'function') p.catch(() => this.pseudoEnter());
      } catch (e) { this.pseudoEnter(); }
    } else { this.pseudoEnter(); }
  },

  exit() {
    if (document.body.classList.contains('pseudo-fs')) { this.pseudoExit(); return; }
    const ex = document.exitFullscreen ||
               document.webkitExitFullscreen ||
               document.webkitCancelFullScreen ||
               document.mozCancelFullScreen ||
               document.msExitFullscreen;
    if (ex) {
      try {
        const p = ex.call(document);
        if (p && typeof p.then === 'function') p.catch(() => {});
      } catch (e) {}
    }
    this.pseudoExit();
  },

  toggle() { if (this.isActive()) this.exit(); else this.enter(); },

  pseudoEnter() {
    document.body.classList.add('pseudo-fs', 'fullscreen');
    this.updateButton();
  },

  pseudoExit() {
    document.body.classList.remove('pseudo-fs', 'fullscreen');
    this.updateButton();
  },

  showExit() {
    fsExitBtn.classList.add('show');
    this.scheduleHide();
  },

  scheduleHide() {
    clearTimeout(this._hideTimer);
    this._hideTimer = setTimeout(() => fsExitBtn.classList.remove('show'), this._idleMs);
  },

  updateButton() {
    const active = this.isActive();
    document.body.classList.toggle('fullscreen', active);
    if (active) {
      fsExitBtn.classList.add('show');
      this.scheduleHide();
    } else {
      fsExitBtn.classList.remove('show');
      clearTimeout(this._hideTimer);
    }
    const iconEl = document.querySelector('#fsBtn svg');
    if (iconEl) {
      iconEl.innerHTML = active
        ? '<path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/>'
        : '<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>';
    }
  },

  activity() {
    if (!this.isActive()) return;
    fsExitBtn.classList.add('show');
    this.scheduleHide();
  }
};

document.getElementById('fsBtn').addEventListener('click', () => FS.toggle());
fsExitBtn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); FS.exit(); });

['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(ev => {
  document.addEventListener(ev, () => FS.updateButton());
});

['mousemove', 'touchstart', 'touchmove', 'keydown'].forEach(ev => {
  document.addEventListener(ev, () => FS.activity(), { passive: true });
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('pseudo-fs')) FS.pseudoExit();
  if (e.altKey && e.key === 'Home') location.href = 'index.html';
  if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey && !e.altKey && e.target === document.body) {
    FS.toggle();
  }
});

document.getElementById('reloadBtn').addEventListener('click', () => {
  loading.classList.remove('hide');
  errorBox.classList.add('hidden');
  frame.src = frame.src;
});

FS.updateButton();
</script>
</body>
</html>
