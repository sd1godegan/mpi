<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ganti PIN · SDN 1 Godegan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
<style>
:root{
  --bg:#FAF8F5;
  --surface:#FFFFFF;
  --surface-2:#F5F2EC;
  --border:#ECE7DE;
  --text:#2E2E3F;
  --text-soft:#5A5A70;
  --muted:#8E8EA0;
  --primary:#8899C4;
  --primary-hover:#7386B5;
  --primary-soft:#EDF0F8;
  --primary-ring:#DDE4F2;
  --lavender:#E0D7EE;
  --m-agama-i:#7E6BA5;
  --butter:#F5EBC8;
  --m-jawa-i:#A89454;
  --sky:#DAE4F2;
  --err:#B8707A;
  --ok:#6B8F62;
  --shadow-lg:0 12px 32px rgba(46,46,63,.10);
  --ease:cubic-bezier(.2,.8,.2,1);
}
[data-theme="dark"]{
  --bg:#1C1C28;
  --surface:#24242F;
  --surface-2:#2A2A38;
  --border:#35353F;
  --text:#ECEAF2;
  --text-soft:#B8B6C8;
  --muted:#8E8CA0;
  --primary:#98A8D0;
  --primary-hover:#A8B8DD;
  --primary-soft:#2E3245;
  --primary-ring:#3A4058;
  --lavender:#3A3248;
  --m-agama-i:#B8A8D8;
  --sky:#2E3644;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;display:grid;place-items:center;padding:1.25rem;
  transition:background .3s,color .3s;
}
svg{display:block}
.icon{
  width:20px;height:20px;stroke:currentColor;stroke-width:1.75;
  stroke-linecap:round;stroke-linejoin:round;fill:none;flex-shrink:0;
}
.icon-sm{width:15px;height:15px;stroke-width:2.2}

body::before,body::after{
  content:'';position:fixed;border-radius:50%;
  pointer-events:none;z-index:0;
}
body::before{
  width:320px;height:320px;background:var(--butter);
  top:-120px;right:-100px;opacity:.55;
}
body::after{
  width:400px;height:400px;background:var(--sky);
  bottom:-160px;left:-140px;opacity:.5;
}
[data-theme="dark"] body::before,
[data-theme="dark"] body::after{opacity:.25}

.card{
  position:relative;z-index:1;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:2.25rem 2rem;
  width:100%;max-width:420px;
  box-shadow:var(--shadow-lg);
  animation:slideUp .5s var(--ease);
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}

.brand{text-align:center;margin-bottom:1.75rem}
.brand-mark{
  width:60px;height:60px;border-radius:16px;
  background:var(--butter);color:var(--m-jawa-i);
  display:grid;place-items:center;margin:0 auto .85rem;
}
.brand-mark .icon{width:26px;height:26px;stroke-width:1.7}
.brand h1{
  font-size:1.2rem;font-weight:700;
  letter-spacing:-.015em;line-height:1.2;
}
.brand p{color:var(--muted);font-size:.85rem;margin-top:.3rem}

.field{margin-bottom:1rem;position:relative}
.field label{
  display:block;font-size:.82rem;font-weight:600;
  color:var(--text);margin-bottom:.4rem;
}
.field label .hint{color:var(--muted);font-weight:500;font-size:.75rem}
.field input{
  width:100%;padding:.75rem .9rem;
  border:1.5px solid var(--border);border-radius:10px;
  background:var(--surface-2);color:var(--text);
  font-size:.95rem;font-family:inherit;outline:none;
  transition:all .2s var(--ease);
}
.field input:focus{
  border-color:var(--primary);background:var(--surface);
  box-shadow:0 0 0 3px var(--primary-ring);
}
.field input::placeholder{color:var(--muted);opacity:.7}
.field input.pin-input{
  letter-spacing:.35em;text-align:center;
  font-weight:700;font-size:1.1rem;
}

.submit{
  width:100%;padding:.85rem;border-radius:10px;border:none;
  background:var(--primary);color:#fff;
  font-weight:700;font-size:.92rem;cursor:pointer;
  font-family:inherit;transition:all .2s var(--ease);
  margin-top:1rem;
  display:flex;align-items:center;justify-content:center;gap:.5rem;
}
.submit:hover:not(:disabled){
  background:var(--primary-hover);
  transform:translateY(-1px);
  box-shadow:0 8px 20px rgba(136,153,196,.35);
}
.submit:disabled{opacity:.6;cursor:not-allowed}
.submit .icon{width:16px;height:16px;stroke-width:2.2}
.spinner-sm{
  width:16px;height:16px;
  border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite;
  display:none;
}
.submit.loading .spinner-sm{display:inline-block}
.submit.loading .icon{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

.msg{
  padding:.7rem .9rem;border-radius:10px;
  font-size:.84rem;margin-top:1rem;display:none;
  align-items:flex-start;gap:.5rem;line-height:1.5;
}
.msg.err{background:#F5E0E4;color:var(--err);display:flex}
.msg.ok{background:#E0EEDC;color:var(--ok);display:flex}
[data-theme="dark"] .msg.err{background:#3A2A32;color:#E0A8B0}
[data-theme="dark"] .msg.ok{background:#2A3628;color:#A8D098}
.msg .icon{width:16px;height:16px;stroke-width:2;flex-shrink:0;margin-top:.1rem}

.back-link{
  display:flex;align-items:center;justify-content:center;gap:.4rem;
  margin-top:1.5rem;color:var(--muted);
  text-decoration:none;font-size:.84rem;font-weight:600;
  transition:color .15s;
}
.back-link:hover{color:var(--primary)}
.back-link .icon{width:14px;height:14px;stroke-width:2.2}

@media(max-width:480px){
  .card{padding:1.75rem 1.4rem}
  body::before,body::after{display:none}
}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-mark">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="3.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg>
    </div>
    <h1>Ganti PIN</h1>
    <p id="greet">SD Negeri 1 Godegan</p>
  </div>

  <form id="form">
    <div class="field">
      <label for="oldPin">PIN Lama</label>
      <input type="password" id="oldPin" class="pin-input" inputmode="numeric" placeholder="••••" required maxlength="8">
    </div>

    <div class="field">
      <label for="newPin">PIN Baru <span class="hint">(min 4 digit)</span></label>
      <input type="password" id="newPin" class="pin-input" inputmode="numeric" placeholder="••••" required minlength="4" maxlength="8">
    </div>

    <div class="field">
      <label for="confirmPin">Ulangi PIN Baru</label>
      <input type="password" id="confirmPin" class="pin-input" inputmode="numeric" placeholder="••••" required minlength="4" maxlength="8">
    </div>

    <button type="submit" class="submit" id="btn">
      <span class="spinner-sm"></span>
      <svg class="icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
      <span>Simpan PIN Baru</span>
    </button>
    <div class="msg" id="msg"></div>
  </form>

  <a class="back-link" href="index.html">
    <svg class="icon" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7M19 12H5"/></svg>
    Kembali ke Katalog
  </a>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxQ7Ve-VLGJIYqJqxHJEfJnnpeq_rw3cGs-LlmRqD81md_GMtPx4H44r6QptEkfF2QGRg/exec";

const Auth = {
  KEY: 'mpi_auth_v3',
  get() { try { return JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch { return null; } },
  set(d) { localStorage.setItem(this.KEY, JSON.stringify(d)); },
  isValid() { const a = this.get(); return !!(a && a.username && a.pin); }
};

async function post(body) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

if (!Auth.isValid()) location.replace('login.html');

const $ = id => document.getElementById(id);
const a = Auth.get();
if (a && a.user) $('greet').textContent = `${a.user.nama} · ${a.user.username}`;

function showMsg(type, text) {
  const msg = $('msg');
  const ico = type === 'ok'
    ? '<svg class="icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>'
    : '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';
  msg.className = 'msg ' + type;
  msg.innerHTML = ico + '<span>' + text + '</span>';
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('btn');
  const oldPin = $('oldPin').value.trim();
  const newPin = $('newPin').value.trim();
  const conf = $('confirmPin').value.trim();

  $('msg').className = 'msg';

  if (oldPin !== a.pin) { showMsg('err', 'PIN lama salah'); return; }
  if (newPin.length < 4) { showMsg('err', 'PIN baru minimal 4 karakter'); return; }
  if (newPin !== conf) { showMsg('err', 'Konfirmasi PIN tidak cocok'); return; }
  if (newPin === oldPin) { showMsg('err', 'PIN baru tidak boleh sama dengan yang lama'); return; }

  btn.disabled = true; btn.classList.add('loading');

  try {
    await post({ action: 'changePassword', username: a.username, pin: oldPin, newPin });
    a.pin = newPin;
    Auth.set(a);
    showMsg('ok', 'PIN berhasil diganti! Mengalihkan...');
    setTimeout(() => location.href = 'index.html', 1200);
  } catch (err) {
    showMsg('err', err.message);
    btn.disabled = false; btn.classList.remove('loading');
  }
});
</script>
</body>
</html>
