<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Masuk · Portal Rumah MPI</title>
<meta name="description" content="Masuk ke Portal Rumah MPI SD Negeri 1 Godegan">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">

<script>
(function(){
  try{
    var t = localStorage.getItem('mpi_theme');
    if(!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>

<style>
:root{
  --bg:#FAF8F5;--surface:#FFFFFF;--surface-2:#F5F2EC;--border:#ECE7DE;
  --text:#2E2E3F;--text-soft:#5A5A70;--muted:#8E8EA0;
  --primary:#8899C4;--primary-hover:#7386B5;--primary-soft:#EDF0F8;--primary-ring:#DDE4F2;
  --lavender:#E0D7EE;--m-agama-i:#7E6BA5;
  --sky:#DAE4F2;
  --err:#B8707A;--ok:#6B8F62;
  --ease:cubic-bezier(.2,.8,.2,1);
}
[data-theme="dark"]{
  --bg:#1C1C28;--surface:#24242F;--surface-2:#2A2A38;--border:#35353F;
  --text:#ECEAF2;--text-soft:#B8B6C8;--muted:#8E8CA0;
  --primary:#98A8D0;--primary-hover:#A8B8DD;--primary-soft:#2E3245;--primary-ring:#3A4058;
  --lavender:#3A3248;--m-agama-i:#B8A8D8;
  --sky:#2E3644;
  --err:#E0A8B0;--ok:#A8D098;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;display:grid;place-items:center;padding:1.25rem;
  transition:background .3s,color .3s;
  position:relative;overflow-x:hidden;
}
svg{display:block}
.icon{width:20px;height:20px;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;fill:none;flex-shrink:0}
.icon-sm{width:15px;height:15px;stroke-width:2.2}
button,input{font-family:inherit}

/* Decorative blobs */
body::before,body::after{
  content:'';position:fixed;border-radius:50%;
  pointer-events:none;z-index:0;filter:blur(70px);
}
body::before{
  width:min(440px,70vw);height:min(440px,70vw);
  background:var(--lavender);
  top:-120px;left:-80px;opacity:.6;
}
body::after{
  width:min(500px,80vw);height:min(500px,80vw);
  background:var(--sky);
  bottom:-160px;right:-100px;opacity:.55;
}
[data-theme="dark"] body::before,
[data-theme="dark"] body::after{opacity:.15}

.card{
  position:relative;z-index:1;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:2.25rem 2rem;
  width:100%;max-width:420px;
  box-shadow:
    0 24px 60px -20px rgba(46,46,63,.14),
    0 2px 8px rgba(46,46,63,.04);
  animation:slideUp .5s var(--ease);
}
[data-theme="dark"] .card{
  box-shadow:
    0 24px 60px -20px rgba(0,0,0,.5),
    0 2px 8px rgba(0,0,0,.2);
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(16px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.brand{text-align:center;margin-bottom:1.75rem}
.brand-mark{
  width:60px;height:60px;border-radius:18px;
  background:var(--primary);color:#fff;
  display:grid;place-items:center;margin:0 auto .85rem;
  box-shadow:0 10px 24px -8px rgba(136,153,196,.5);
}
.brand-mark .icon{width:28px;height:28px;stroke-width:1.7}
.brand h1{font-size:1.25rem;font-weight:700;letter-spacing:-.015em;line-height:1.2}
.brand p{color:var(--muted);font-size:.85rem;margin-top:.3rem}

.field{margin-bottom:1rem;position:relative}
.field label{
  display:block;font-size:.82rem;font-weight:600;
  color:var(--text);margin-bottom:.4rem;
}
.field input{
  width:100%;padding:.75rem .9rem;
  border:1.5px solid var(--border);border-radius:10px;
  background:var(--surface-2);color:var(--text);
  font-size:.95rem;outline:none;
  transition:all .2s var(--ease);
}
.field input:focus{
  border-color:var(--primary);background:var(--surface);
  box-shadow:0 0 0 3px var(--primary-ring);
}
.field input::placeholder{color:var(--muted);opacity:.7}
.field input.pin-input{
  letter-spacing:.35em;text-align:center;
  font-weight:700;font-size:1.1rem;padding-right:2.5rem;
}
.toggle-pw{
  position:absolute;right:.65rem;top:2.1rem;
  background:transparent;border:none;cursor:pointer;
  color:var(--muted);padding:.3rem;border-radius:6px;
  transition:all .15s;
}
.toggle-pw:hover{background:var(--surface-2);color:var(--text)}

.submit{
  width:100%;padding:.85rem;border-radius:10px;border:none;
  background:var(--primary);color:#fff;
  font-weight:700;font-size:.92rem;cursor:pointer;
  transition:all .2s var(--ease);
  margin-top:.85rem;
  display:flex;align-items:center;justify-content:center;gap:.5rem;
  letter-spacing:-.005em;
}
.submit:hover:not(:disabled){
  background:var(--primary-hover);
  transform:translateY(-1px);
  box-shadow:0 8px 20px rgba(136,153,196,.35);
}
.submit:disabled{opacity:.6;cursor:not-allowed}
.spinner-sm{
  width:16px;height:16px;
  border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite;
  display:none;
}
.submit.loading .spinner-sm{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

.msg{
  padding:.7rem .9rem;border-radius:10px;
  font-size:.84rem;margin-top:1rem;display:none;
  align-items:flex-start;gap:.5rem;line-height:1.5;
}
.msg.err{background:#F5E0E4;color:var(--err);display:flex}
.msg.ok{background:#E0EEDC;color:var(--ok);display:flex}
[data-theme="dark"] .msg.err{background:#3A2A32;color:#E0A8B0}
[data-theme="dark"] .msg.ok{background:#2A3628;color:#A8D098}
.msg .icon{width:16px;height:16px;stroke-width:2;flex-shrink:0;margin-top:.1rem}

.help{
  margin-top:1.25rem;padding:.85rem 1rem;
  background:var(--primary-soft);
  border-radius:10px;font-size:.78rem;
  color:var(--text-soft);line-height:1.55;
}
.help strong{color:var(--text);display:block;margin-bottom:.15rem;font-size:.8rem}

.back-link{
  display:flex;align-items:center;justify-content:center;gap:.4rem;
  margin-top:1.5rem;color:var(--muted);
  text-decoration:none;font-size:.84rem;font-weight:600;
  transition:color .15s;
}
.back-link:hover{color:var(--primary)}
.back-link .icon{width:14px;height:14px;stroke-width:2.2}

@media(max-width:480px){
  .card{padding:1.75rem 1.4rem}
  body::before,body::after{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-mark">
      <svg class="icon" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h1>Masuk ke Rumah MPI</h1>
    <p>SD Negeri 1 Godegan</p>
  </div>

  <form id="form">
    <div class="field">
      <label for="username">ID Guru</label>
      <input type="text" id="username" placeholder="Contoh: G001" autocomplete="username" required autofocus>
    </div>

    <div class="field">
      <label for="pin">PIN</label>
      <input type="password" id="pin" class="pin-input" inputmode="numeric" placeholder="••••" autocomplete="off" required maxlength="8">
      <button type="button" class="toggle-pw" id="togglePw" title="Lihat PIN">
        <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <button type="submit" class="submit" id="submitBtn">
      <span class="spinner-sm"></span>
      <span>Masuk</span>
    </button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="help">
    <strong>Belum punya akun?</strong>
    Hubungi admin sekolah untuk mendapatkan ID & PIN.
  </div>

  <a class="back-link" href="index.html">
    <svg class="icon" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7M19 12H5"/></svg>
    Kembali ke Rumah MPI
  </a>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxQ7Ve-VLGJIYqJqxHJEfJnnpeq_rw3cGs-LlmRqD81md_GMtPx4H44r6QptEkfF2QGRg/exec";

const Auth = {
  KEY: 'mpi_auth_v3',
  get() { try { return JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch { return null; } },
  set(d) { localStorage.setItem(this.KEY, JSON.stringify(d)); },
  clear() { localStorage.removeItem(this.KEY); },
  isValid() { const a = this.get(); return !!(a && a.username && a.pin); }
};

const API = {
  async post(body) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    return json;
  }
};

const form = document.getElementById('form');
const btn = document.getElementById('submitBtn');
const msg = document.getElementById('msg');
const pinField = document.getElementById('pin');
const togglePw = document.getElementById('togglePw');

togglePw.addEventListener('click', () => {
  const isPw = pinField.type === 'password';
  pinField.type = isPw ? 'text' : 'password';
  togglePw.innerHTML = isPw
    ? '<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>'
    : '<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
});

(function checkExisting() {
  if (Auth.isValid()) {
    const a = Auth.get();
    fetch(`${API_URL}?action=me&username=${encodeURIComponent(a.username)}&pin=${encodeURIComponent(a.pin)}`)
      .then(r => r.json())
      .then(j => { if (j.user) location.replace(getRedirect()); })
      .catch(() => {});
  }
})();

function showMsg(type, text) {
  const ico = type === 'ok'
    ? '<svg class="icon" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>'
    : '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>';
  msg.className = 'msg ' + type;
  msg.innerHTML = ico + '<span>' + text + '</span>';
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  btn.disabled = true;
  btn.classList.add('loading');
  msg.className = 'msg';

  const username = document.getElementById('username').value.trim().toUpperCase();
  const pin = pinField.value.trim();

  try {
    const json = await API.post({ action: 'login', username, pin });
    Auth.set({ username: json.user.username, pin, user: json.user });
    showMsg('ok', 'Berhasil! Mengalihkan...');
    setTimeout(() => location.replace(getRedirect()), 500);
  } catch (err) {
    showMsg('err', err.message);
    btn.disabled = false;
    btn.classList.remove('loading');
    pinField.select();
  }
});

function getRedirect() {
  return new URLSearchParams(location.search).get('redirect') || 'index.html';
}
</script>
</body>
</html>
