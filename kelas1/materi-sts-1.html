<script>
/* =========================================================
   DATA KELAS (Layer 1)
========================================================= */
const KELAS = [
  { id: 1, warna: 'from-rose-400 to-rose-600',     topik: 'Huruf Hijaiah, Al-Fatihah, Ar-Rahman & Ar-Rahim, Basmalah & Hamdalah' },
  { id: 2, warna: 'from-sky-400 to-sky-600',       topik: 'Huruf Sambung, An-Nas, 4 Asmaulhusna, Subhanallah & Masya Allah' },
  { id: 3, warna: 'from-violet-400 to-violet-600', topik: 'Al-Fil, 20 Sifat Allah, Husnuzan' },
  { id: 4, warna: 'from-amber-400 to-amber-600',   topik: "Al-'Alaq 1-5, 4 Asmaulhusna, Akhlak Keluarga" },
  { id: 5, warna: 'from-teal-400 to-teal-600',     topik: 'Al-Qadr, 4 Asmaulhusna, Doa-Ikhtiar-Tawakal' },
  { id: 6, warna: 'from-indigo-400 to-indigo-600', topik: 'Al-Kafirun & Tajwid Mad, 4 Asmaulhusna, Toleransi' }
];

/* =========================================================
   KOMPONEN UMUM
========================================================= */
function kartu(judul, isi, warnaHeader){
  return `
  <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden mb-4">
    <div class="px-4 py-3 ${warnaHeader} border-b">
      <h3 class="font-bold text-base flex items-center gap-2">${judul}</h3>
    </div>
    <div class="p-4 text-slate-700 text-[15px] leading-relaxed">${isi}</div>
  </section>`;
}

function subjudul(teks){
  return `<h4 class="font-bold text-slate-800 text-[15px] mt-4 mb-2 flex items-center gap-2">
    <span class="w-1.5 h-5 bg-emerald-500 rounded-full inline-block"></span>${teks}
  </h4>`;
}

function tabelAyat(rows){
  return `
  <div class="overflow-x-auto rounded-xl border border-slate-200 my-3">
    <table class="w-full text-left border-collapse text-sm">
      <thead>
        <tr class="bg-slate-100 text-slate-700">
          <th class="p-2 text-center w-10 border-b border-slate-200">#</th>
          <th class="p-2 text-right border-b border-slate-200">Lafaz Arab</th>
          <th class="p-2 border-b border-slate-200">Transliterasi &amp; Arti</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-200">
        ${rows.map(r => `
          <tr class="hover:bg-slate-50 align-top">
            <td class="p-2 text-center font-bold text-slate-500">${r[0]}</td>
            <td class="p-3 text-right arabic text-xl text-slate-800 leading-loose">${r[1]}</td>
            <td class="p-2">
              <div class="font-semibold text-emerald-700 text-xs md:text-sm">${r[2]}</div>
              <div class="text-xs text-slate-600 mt-1">${r[3]}</div>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

function tips(isi){ return `<div class="kotak-tips">💡 <b>Ingat:</b> ${isi}</div>`; }
function info(isi){ return `<div class="kotak-info">📌 <b>Info:</b> ${isi}</div>`; }
function hikmah(isi){ return `<div class="kotak-hikmah">🌿 <b>Hikmah:</b> ${isi}</div>`; }

/* =========================================================
   KOMPONEN KHUSUS
========================================================= */
const HIJAIah = [
  ['ا','Alif'],['ب','Ba'],['ت','Ta'],['ث','Tsa'],['ج','Jim'],['ح','Ha'],['خ','Kha'],
  ['د','Dal'],['ذ','Dzal'],['ر','Ra'],['ز','Zai'],['س','Sin'],['ش','Syin'],['ص','Sad'],
  ['ض','Dad'],['ط','Ta'],['ظ','Za'],['ع',"'Ain"],['غ','Ghain'],['ف','Fa'],['ق','Qaf'],
  ['ك','Kaf'],['ل','Lam'],['م','Mim'],['ن','Nun'],['و','Wawu'],['هـ','Ha'],['ء','Hamzah'],['ي','Ya']
];
function gridHijaiah(){
  return `<div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2 my-3">
    ${HIJAIah.map(([h,n])=>`
      <div class="bg-blue-50 border border-blue-100 rounded-xl py-2 text-center">
        <div class="arabic text-2xl text-blue-800">${h}</div>
        <div class="text-[10px] text-slate-500 mt-0.5">${n}</div>
      </div>`).join('')}
  </div>`;
}

const SIFAT = [
  ['Wujud','Ada',"‘Adam",'Tidak ada'],
  ['Qidam','Terdahulu','Hudus','Baru'],
  ["Baqa'",'Kekal',"Fana'",'Binasa/Rusak'],
  ['Mukhalafatu lil hawadisi','Berbeda dengan makhluk','Mumasalatu lil hawadisi','Sama dengan makhluk'],
  ['Qiyamuhu binafsihi','Berdiri sendiri','Ihtiyaju lighairihi','Butuh yang lain'],
  ['Wahdaniyah','Esa / Tunggal',"Ta'addud",'Berbilang'],
  ['Qudrah','Kuasa',"'Ajzun",'Lemah'],
  ['Iradah','Berkehendak','Karahah','Terpaksa'],
  ["'Ilmu",'Mengetahui','Jahlun','Bodoh'],
  ['Hayat','Hidup','Mautun','Mati'],
  ["Sama'",'Mendengar','Summun','Tuli'],
  ['Basar','Melihat',"'Umyun",'Buta'],
  ['Kalam','Berfirman','Bukmun','Bisu'],
  ['Qadiran','Dzat Yang Maha Kuasa',"'Ajizan",'Dzat Yang Lemah'],
  ['Muridan','Dzat Yang Berkehendak','Karihan','Dzat Yang Terpaksa'],
  ["'Aliman",'Dzat Yang Mengetahui','Jahilan','Dzat Yang Bodoh'],
  ['Hayyan','Dzat Yang Hidup','Mayyitan','Dzat Yang Mati'],
  ["Sami'an",'Dzat Yang Mendengar','Asamma','Dzat Yang Tuli'],
  ['Basiran','Dzat Yang Melihat',"A'ma",'Dzat Yang Buta'],
  ['Mutakalliman','Dzat Yang Berfirman','Abkam','Dzat Yang Bisu']
];

          <li><b>Menyebar hoaks</b> — menyebarkan berita bohong tentang teman.</li>
          <li><b>Mengucilkan</b> — tidak mengajak teman tertentu karena alasan fisik atau ekonomi.</li>
          <li><b>Bertengkar tanpa alasan jelas</b> — memicu permusuhan.</li>
        </ul>
      `, 'bg-amber-50 text-amber-900 border-amber-100')}

      ${kartu('🕊️ Resolusi Konflik', `
        <p>Dalam bergaul, pasti ada saat berbeda pendapat atau berselisih. Islam mengajarkan kita untuk menyelesaikannya dengan cara yang baik.</p>

        ${subjudul('Cara Menyelesaikan Konflik:')}
        <ul>
          <li><b>Musyawarah</b> — bicarakan dengan kepala dingin, cari solusi bersama.</li>
          <li><b>Segera minta maaf</b> jika kita yang salah, jangan menunda.</li>
          <li><b>Segera memaafkan</b> jika teman yang salah — jangan menyimpan dendam.</li>
          <li><b>Jangan mengungkit</b> kesalahan lama saat sudah berdamai.</li>
          <li>Jika sulit diselesaikan sendiri, minta bantuan guru atau orang tua sebagai penengah.</li>
        </ul>

        ${hikmah("Toleransi dan akhlak berteman yang baik membuat kita disukai banyak orang, hidup rukun, dan menjadi Muslim yang bermanfaat bagi sesama.")}
      `, 'bg-amber-50 text-amber-900 border-amber-100')}
    `,

    kuis: [
      { soal:'Al-Kafirun artinya ...', pilihan:['Orang-orang kafir','Manusia','Kemuliaan'], jawaban:0, pembahasan:'Al-Kafirun artinya "Orang-orang kafir".' },
      { soal:'Surah Al-Kafirun terdiri dari berapa ayat?', pilihan:['5 ayat','6 ayat','7 ayat'], jawaban:1, pembahasan:'Al-Kafirun terdiri dari 6 ayat.' },
      { soal:'Al-Kafirun tergolong surah ...', pilihan:['Madaniyah','Makkiyah','Campuran'], jawaban:1, pembahasan:'Al-Kafirun adalah surah Makkiyah (turun di Mekah).' },
      { soal:'Mad Wajib Muttasil dibaca panjang ...', pilihan:['2 harakat','4-5 harakat','6 harakat'], jawaban:1, pembahasan:'Mad Wajib Muttasil dibaca 4-5 harakat.' },
      { soal:'Mad Jaiz Munfasil terjadi ketika huruf mad bertemu hamzah di ...', pilihan:['satu kata','dua kata terpisah','tiga kata'], jawaban:1, pembahasan:'Mad Jaiz Munfasil terjadi di dua kata terpisah.' },
      { soal:'Al-Ahad artinya ...', pilihan:['Maha Esa','Maha Pemaaf','Maha Dibutuhkan'], jawaban:0, pembahasan:'Al-Ahad artinya Maha Esa.' },
      { soal:'Perbedaan Al-Ghaffar dan Al-\'Afuw adalah ...', pilihan:['Al-Ghaffar menutupi, Al-\'Afuw menghapus','Keduanya sama','Al-Ghaffar menghapus, Al-\'Afuw menutupi'], jawaban:0, pembahasan:'Al-Ghaffar menutupi dosa, Al-\'Afuw menghapus total catatan dosa.' },
      { soal:'Sikap kita terhadap teman beda agama adalah ...', pilihan:['Menjauhi','Mengucilkan','Menghargai dengan toleransi'], jawaban:2, pembahasan:'Kita tetap bertoleransi dan menghargai tanpa mencampuradukkan akidah.' },
      { soal:'Batas toleransi yang TIDAK boleh dilakukan adalah ...', pilihan:['Membantu korban bencana','Mengikuti ritual ibadah agama lain','Bermain bersama'], jawaban:1, pembahasan:'Mengikuti ritual ibadah agama lain melampaui batas toleransi.' },
      { soal:'Saat teman bersalah kepada kita, sebaiknya ...', pilihan:['Menyimpan dendam','Segera memaafkan','Mengucilkan'], jawaban:1, pembahasan:'Islam mengajarkan untuk segera memaafkan.' }
    ]
  }
};

/* =========================================================
   RENDER LAYER 1
========================================================= */
function renderHome(){
  const grid = document.getElementById('grid-kelas');
  grid.innerHTML = KELAS.map(k => `
    <button onclick="bukaKelas(${k.id})"
      class="group bg-white rounded-2xl p-4 md:p-5 shadow-sm hover:shadow-md active:scale-95 transition border border-slate-200 text-left">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-br ${k.warna} text-white flex items-center justify-center text-xl font-extrabold mb-3 shadow">
        ${k.id}
      </div>
      <h3 class="font-bold text-slate-800 text-base">Kelas ${k.id}</h3>
      <p class="text-[11px] text-slate-500 mt-1 leading-snug">${k.topik}</p>
    </button>
  `).join('');
}

/* =========================================================
   LAYER 2: BUKA KELAS
========================================================= */
let currentKelas = null;
let currentElemen = 'quran';

function bukaKelas(id){
  currentKelas = id;
  currentElemen = 'quran';
  skorKuis = {};
  document.getElementById('home').classList.add('hidden');
  document.getElementById('materi').classList.remove('hidden');
  document.getElementById('judul-kelas').textContent = 'Kelas ' + id;
  document.getElementById('subjudul').textContent = KELAS.find(k => k.id === id).topik;
  updateTabAktif();
  renderKonten();
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function kembali(){
  document.getElementById('materi').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function pilihElemen(el){
  currentElemen = el;
  updateTabAktif();
  renderKonten();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateTabAktif(){
  document.querySelectorAll('.tab-elemen').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === currentElemen);
  });
}

function renderKonten(){
  const konten = document.getElementById('konten');
  if (currentElemen === 'kuis'){
    skorKuis = {};
    konten.innerHTML = renderKuis(currentKelas);
  } else {
    konten.innerHTML = MATERI[currentKelas][currentElemen];
  }
  konten.classList.remove('fade-in');
  void konten.offsetWidth;
  konten.classList.add('fade-in');
}

/* =========================================================
   KUIS
========================================================= */
function renderKuis(kelasId){
  const daftar = MATERI[kelasId].kuis;
  return `
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden mb-4">
      <div class="px-4 py-3 bg-gradient-to-r from-emerald-500 to-emerald-600 text-white">
        <h3 class="font-bold text-base">📝 Kuis Kelas ${kelasId}</h3>
        <p class="text-[11px] text-emerald-100 mt-0.5">Pilih jawaban yang paling tepat. Jawaban langsung dinilai.</p>
      </div>
      <div class="p-4">
        <div id="skor-box" class="hidden mb-4 p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-center">
          <p class="text-sm text-emerald-800">Skor kamu: <b><span id="skor">0</span> / ${daftar.length}</b></p>
          <button onclick="renderKonten()" class="mt-2 text-xs bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-medium hover:bg-emerald-700">🔄 Ulangi Kuis</button>
        </div>
        ${daftar.map((q, i) => `
          <div class="mb-4 p-3 rounded-xl border border-slate-200 bg-slate-50/50" data-q="${i}">
            <p class="font-semibold text-sm mb-2 text-slate-800">${i+1}. ${q.soal}</p>
            <div class="space-y-2">
              ${q.pilihan.map((p, j) => `
                <button onclick="jawab(this, ${j === q.jawaban}, ${i})"
                  class="opsi w-full text-left px-3 py-2 rounded-lg border border-slate-200 bg-white hover:bg-emerald-50 hover:border-emerald-300 transition text-sm">
                  <span class="font-bold text-slate-500 mr-1">${String.fromCharCode(65+j)}.</span> ${p}
                </button>
              `).join('')}
            </div>
            <p id="bahas-${i}" class="hidden mt-2 text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-lg p-2">💡 ${q.pembahasan}</p>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

let skorKuis = {};
function jawab(btn, benar, idx){
  const parent = btn.closest('[data-q]');
  if (parent.dataset.done === '1') return;
  parent.dataset.done = '1';

  parent.querySelectorAll('.opsi').forEach(b => {
    b.disabled = true;
    b.classList.add('opacity-50', 'cursor-not-allowed');
  });

  if (benar){
    btn.classList.remove('opacity-50');
    btn.classList.add('!bg-emerald-500', '!text-white', '!border-emerald-500');
  } else {
    btn.classList.remove('opacity-50');
    btn.classList.add('!bg-red-500', '!text-white', '!border-red-500');
  }
  document.getElementById('bahas-' + idx).classList.remove('hidden');

  skorKuis[idx] = benar ? 1 : 0;
  const total = Object.values(skorKuis).reduce((a,b)=>a+b, 0);
  document.getElementById('skor').textContent = total;
  document.getElementById('skor-box').classList.remove('hidden');

  const totalSoal = MATERI[currentKelas].kuis.length;
  if (Object.keys(skorKuis).length === totalSoal){
    document.getElementById('skor-box').classList.add('!bg-emerald-100');
  }
}

/* =========================================================
   INIT
========================================================= */
renderHome();
</script>
</body>
</html>
