<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petualangan Bentuk — Bangun Datar & Bangun Ruang</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2D2A32;
  --muted:#6B6672;
  --card:#fff;
  --blue:#4F9DFF;
  --green:#4CD964;
  --orange:#FF8A5B;
  --yellow:#FFD23F;
  --pink:#FF6B9D;
  --purple:#9B6BFF;
  --red:#FF5C5C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Baloo 2','Trebuchet MS',system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at 15% 5%,#FFEFC4 0%,#FFF9EC 35%,#E9F5FF 100%);
  min-height:100vh;color:var(--ink);-webkit-font-smoothing:antialiased;
}
#app{max-width:920px;margin:0 auto;padding:12px 14px 90px;}

/* ---------- Topbar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px 14px;}
.app-title{
  flex:1;text-align:center;font-weight:800;letter-spacing:.4px;
  font-size:clamp(17px,4vw,25px);
  background:linear-gradient(90deg,#4F9DFF,#9B6BFF,#FF6B9D);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.icon-btn{
  width:48px;height:48px;border-radius:16px;border:none;background:#fff;
  box-shadow:0 4px 0 #E4E0D8,0 6px 14px rgba(0,0,0,.06);
  font-size:22px;cursor:pointer;display:grid;place-items:center;
  transition:transform .12s,box-shadow .12s;
}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #E4E0D8;}

/* ---------- Screen ---------- */
.screen{animation:fadeUp .35s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.screen-title{font-size:clamp(20px,4.5vw,28px);font-weight:800;margin:6px 0 4px;text-align:center;}
.hint{text-align:center;color:var(--muted);font-size:clamp(14px,2.8vw,17px);margin:0 0 18px;}
.mini-title{text-align:center;font-size:20px;font-weight:800;margin:26px 0 12px;}

/* ---------- Home ---------- */
.hero{text-align:center;padding:6px 6px 22px;}
.hero-emoji{font-size:clamp(32px,8vw,52px);letter-spacing:6px;animation:bounce 2s infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.hero h2{font-size:clamp(20px,4.5vw,28px);margin:10px 0 4px;}
.hero p{margin:0;color:var(--muted);}
.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media(min-width:640px){.menu-grid{grid-template-columns:repeat(3,1fr);}}
.menu-card{
  border:none;border-radius:24px;padding:22px 14px;cursor:pointer;background:#fff;
  display:flex;flex-direction:column;align-items:center;gap:10px;
  font-family:inherit;font-weight:700;font-size:clamp(14px,2.6vw,17px);color:var(--ink);
  box-shadow:0 6px 0 rgba(0,0,0,.08),0 12px 22px rgba(0,0,0,.06);
  transition:transform .15s,box-shadow .15s;
}
.menu-card:hover{transform:translateY(-3px);}
.menu-card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.08);}
.menu-icon{font-size:clamp(30px,6vw,42px);}
.menu-blue{background:linear-gradient(160deg,#EAF4FF,#fff);border-bottom:6px solid var(--blue);}
.menu-purple{background:linear-gradient(160deg,#F1EAFF,#fff);border-bottom:6px solid var(--purple);}
.menu-green{background:linear-gradient(160deg,#E9FFF0,#fff);border-bottom:6px solid var(--green);}
.menu-orange{background:linear-gradient(160deg,#FFF0E6,#fff);border-bottom:6px solid var(--orange);}
.menu-yellow{background:linear-gradient(160deg,#FFF9E0,#fff);border-bottom:6px solid var(--yellow);}

/* ---------- Shape cards ---------- */
.shape-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin-bottom:18px;}
.shape-card{
  background:#fff;border:none;border-radius:22px;padding:16px 8px 12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  font-family:inherit;font-weight:700;font-size:15px;color:var(--ink);
  box-shadow:0 5px 0 rgba(0,0,0,.07),0 10px 18px rgba(0,0,0,.05);
  outline:4px solid transparent;transition:transform .15s,box-shadow .15s,outline .15s;
}
.shape-card:hover{transform:translateY(-3px);}
.shape-card:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.07);}
.shape-card.active{outline-color:var(--yellow);box-shadow:0 5px 0 #F0B800,0 10px 20px rgba(255,180,0,.3);}
.shape-name{font-size:14px;}
.shape-svg{display:block;}

/* ---------- Info box ---------- */
.info-box{

.info-box h3{margin:0 0 6px;font-size:22px;}

.info-examples{display:flex;flex-wrap:wrap;gap:8px;}
.example-chip{background:#FFF3D6;border-radius:12px;padding:6px 12px;font-size:14px;font-weight:600;}

/* ---------- Quiz ---------- */

.quiz-head{display:flex;justify-content:space-between;font-weight:700;color:var(--muted);font-size:15px;margin-bottom:12px;}
.quiz-prompt{text-align:center;margin-bottom:16px;}
.q-text{font-size:clamp(17px,3.6vw,21px);font-weight:700;margin:10px 0 0;}
.object-art{display:flex;justify-content:center;}
.object-art svg{width:110px;height:110px;}
.quiz-options{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.opt-btn{
  flex:1 1 72px;max-width:130px;min-width:72px;
  background:#F4F7FB;border:none;border-radius:18px;padding:12px 6px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-family:inherit;font-weight:700;font-size:13px;color:var(--ink);
  box-shadow:0 4px 0 #E1E7F0;transition:transform .12s,box-shadow .12s,background .2s;
}
.opt-btn:hover{background:#EAF1FA;}
.opt-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #E1E7F0;}
.opt-btn.correct{background:#D9F9E4;box-shadow:0 4px 0 #6BD98A;}
.opt-btn.wrong{background:#FFE0E0;box-shadow:0 4px 0 #FF9A9A;animation:shake .4s;}
.opt-btn.num{font-size:26px;padding:18px 6px;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.feedback{text-align:center;font-weight:700;font-size:17px;min-height:26px;margin-top:14px;}
.feedback.ok{color:#2FA84F;}
.feedback.bad{color:#D64545;}
.quiz-done{text-align:center;padding:10px;}
.big-emoji{font-size:56px;}
.quiz-done h3{font-size:24px;margin:8px 0;}
.quiz-done p{color:var(--muted);font-size:17px;margin:0 0 16px;}
.btn-primary{
  background:linear-gradient(160deg,#4F9DFF,#2E7BE0);color:#fff;border:none;border-radius:18px;
  padding:14px 28px;font-family:inherit;font-weight:800;font-size:17px;cursor:pointer;
  box-shadow:0 5px 0 #1F5FBF;transition:transform .12s,box-shadow .12s;
}
.btn-primary:active{transform:translateY(4px);box-shadow:0 1px 0 #1F5FBF;}

.sort-items{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px;min-height:80px;}
.sort-chip{

  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-family:inherit;font-weight:700;font-size:13px;color:var(--ink);

  transition:transform .12s,box-shadow .12s,outline .15s;
}
.sort-chip.selected{outline-color:var(--yellow);transform:translateY(-4px);box-shadow:0 6px 0 #F0B800;}
.sort-chip:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.08);}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.basket{border-radius:22px;padding:14px;min-height:150px;border:4px dashed;transition:background .2s,transform .12s;}
.basket-datar{border-color:var(--blue);background:#F0F7FF;}
.basket-ruang{border-color:var(--purple);background:#F6F0FF;}
.basket-title{font-weight:800;text-align:center;margin-bottom:10px;font-size:16px;}
.basket-items{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.basket-item{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;}
.basket.pop{animation:pop .3s;}
.basket.shake{animation:shake .4s;}
@keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.05);}100%{transform:scale(1);}}
.result-panel{
  margin-top:22px;background:#fff;border-radius:22px;padding:20px;text-align:center;
  box-shadow:0 6px 0 rgba(0,0,0,.06),0 12px 24px rgba(0,0,0,.06);animation:fadeUp .35s;

.result-panel h3{margin:0 0 8px;font-size:22px;}
.result-panel p{margin:6px 0;font-size:17px;color:#55505A;}
.result-big{font-size:26px;font-weight:800;color:var(--ink);}

/* ---------- Scene ---------- */
.scene{

  margin-bottom:18px;box-shadow:0 6px 0 rgba(0,0,0,.05),inset 0 0 0 3px #fff;
}
.scene svg{width:100%;height:auto;display:block;}
</style>
</head>

/* =========================================================
   UTIL SUARA
   ========================================================= */
let muted = false;
function speak(text){
  if(muted || !('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'id-ID'; u.rate = 0.92; u.pitch = 1.15;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* =========================================================
   QUIZ ENGINE
   ========================================================= */
function runQuiz(container, questions, onDone){
  let idx = 0, correctCount = 0;
  const total = questions.length;

  function draw(){
    if(!container.isConnected) return;
    if(idx >= total){ finish(); return; }
    const q = questions[idx];
    container.innerHTML = `
      <div class="quiz-head">
        <span>Soal ${idx + 1} / ${total}</span>
        <span>⭐ ${correctCount}</span>
      </div>
      <div class="quiz-prompt">${q.prompt}</div>
      <div class="quiz-options">
        ${q.options.map((o,i)=>`<button class="opt-btn ${o.cls||''}" data-i="${i}">${o.html}</button>`).join('')}
      </div>
      <div class="feedback" id="fb"></div>
    `;
    container.querySelectorAll('.opt-btn').forEach(btn=>{
      btn.onclick = ()=>{
        if(btn.disabled) return;
        const i = +btn.dataset.i;
        const fb = container.querySelector('#fb');
        if(q.options[i].correct){
          btn.classList.add('correct');
          correctCount++;
          fb.textContent = '🎉 Hebat! Benar!';
          fb.className = 'feedback ok';
          speak('Hebat! Benar!');
          container.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
          setTimeout(()=>{ if(!container.isConnected) return; idx++; draw(); }, 1100);
        }else{
          btn.classList.add('wrong');
          fb.textContent = 'Coba lagi ya 😊';
          fb.className = 'feedback bad';
          speak('Coba lagi ya');
          setTimeout(()=>btn.classList.remove('wrong'), 500);
        }
      };
    });
    if(q.speak) speak(q.speak);
  }

  function finish(){
    if(!container.isConnected) return;
    container.innerHTML = `
      <div class="quiz-done">
        <div class="big-emoji">${correctCount === total ? '🏆' : '🎈'}</div>
        <h3>${correctCount === total ? 'Sempurna!' : 'Selesai!'}</h3>
        <p>Kamu menjawab benar <b>${correctCount}</b> dari <b>${total}</b> soal.</p>
        <button class="btn-primary" id="retry">Main Lagi 🔁</button>
      </div>
    `;
    container.querySelector('#retry').onclick = ()=>{ idx = 0; correctCount = 0; draw(); };
    speak(`Selesai! Kamu menjawab benar ${correctCount} dari ${total} soal.`);
    if(onDone) onDone(correctCount, total);
  }

  draw();
}

function makeObjectQuiz(keys){
  return keys.map(k=>{
    const o = OBJECTS[k];
    return {
      prompt: `<div class="object-art">${o.svg}</div><p class="q-text">Ini bentuk apa?</p>`,
      speak: 'Ini bentuk apa?',
      options: DATAR.map(d=>({
        html: `${svgShape(d.key, 52)}<span>${d.name}</span>`,
        correct: d.key === o.answer
      }))
    };
  });
}

        ${DATAR.map(d=>`
          <button class="shape-card" data-shape="${d.key}">
            ${svgShape(d.key, 84)}
            <span class="shape-name">${d.name}</span>
          </button>
        `).join('')}
      </div>
      <div class="info-box" id="datarInfo" hidden></div>
      <h3 class="mini-title">🎯 Ayo Coba!</h3>
      <div class="quiz-box" id="datarQuiz"></div>
    `,
    init: () => {
      const info = app.querySelector('#datarInfo');
      app.querySelectorAll('.shape-card[data-shape]').forEach(card=>{
        card.onclick = ()=>{
          app.querySelectorAll('.shape-card').forEach(c=>c.classList.remove('active'));
          card.classList.add('active');
          const d = DATAR.find(x=>x.key === card.dataset.shape);
          info.hidden = false;
          info.innerHTML = `
            <div class="info-shape">${svgShape(d.key, 96)}</div>
            <div>
              <h3>${d.name}</h3>
              <p>${d.desc}</p>
              <div class="info-examples">${d.ex.map(e=>`<span class="example-chip">${e}</span>`).join('')}</div>
            </div>
          `;
          speak(`${d.name}. ${d.desc}`);
        };
      });
      runQuiz(app.querySelector('#datarQuiz'), makeObjectQuiz(['jendela','buku','penggaris','kue']));
    }
  },

  /* ---------- BANGUN RUANG ---------- */
  ruang: {
    html: () => `
      <h2 class="screen-title">🧊 Kenali Bangun Ruang</h2>
      <p class="hint">Ketuk setiap bentuk untuk mendengar namanya.</p>
      <div class="shape-grid">
        ${RUANG.map(d=>`
          <button class="shape-card" data-shape="${d.key}">
            ${svgShape(d.key, 84)}
            <span class="shape-name">${d.name}</span>
          </button>
        `).join('')}
      </div>
      <div class="info-box" id="ruangInfo" hidden></div>
      <h3 class="mini-title">🎯 Ayo Coba!</h3>
      <div class="quiz-box" id="ruangQuiz"></div>
    `,
    init: () => {
      const info = app.querySelector('#ruangInfo');
      app.querySelectorAll('.shape-card[data-shape]').forEach(card=>{
        card.onclick = ()=>{
          app.querySelectorAll('.shape-card').forEach(c=>c.classList.remove('active'));
          card.classList.add('active');
          const d = RUANG.find(x=>x.key === card.dataset.shape);
          info.hidden = false;
          info.innerHTML = `
            <div class="info-shape">${svgShape(d.key, 96)}</div>
            <div>
              <h3>${d.name}</h3>
              <p>${d.desc}</p>
              <div class="info-examples"><span class="example-chip">✨ ${d.trait}</span></div>
            </div>
          `;
          speak(`${d.name}. ${d.desc}`);
        };
      });
      const qs = [
        {text:'Mana yang bentuknya bulat?', ans:'bola'},
        {text:'Mana yang punya ujung runcing?', ans:'kerucut'},
        {text:'Mana yang mirip dadu?', ans:'kubus'},
        {text:'Mana yang mirip kaleng susu?', ans:'tabung'}
      ].map(q=>({
        prompt: `<p class="q-text">${q.text}</p>`,
        speak: q.text,
        options: RUANG.map(d=>({
          html: `${svgShape(d.key, 48)}<span>${d.name}</span>`,
          correct: d.key === q.ans
        }))
      }));
      runQuiz(app.querySelector('#ruangQuiz'), qs);
    }
  },

  /* ---------- HITUNG CIRI ---------- */
  ciri: {
    html: () => `
      <h2 class="screen-title">🔢 Hitung Ciri Bentuk</h2>
      <p class="hint">Perhatikan bentuk, lalu pilih jawaban yang benar.</p>
      <div class="quiz-box" id="ciriQuiz"></div>
    `,
    init: () => {
      const qs = CIRI_QUESTIONS.map(q=>({
        prompt: `
          <div class="object-art">${svgShape(q.shape, 150)}</div>
          <p class="q-text">${q.q}</p>
        `,
        speak: q.q,
        options: [2,3,4,5].map(n=>({
          html: `<span>${n}</span>`,
          cls: 'num',
          correct: n === q.ans
        }))
      }));
      runQuiz(app.querySelector('#ciriQuiz'), qs);
    }
  },

  /* ---------- SORTIR ---------- */
  sortir: {
    html: () => `
      <h2 class="screen-title">🧺 Sortir & Bandingkan</h2>
      <p class="hint">Ketuk bentuk di atas, lalu ketuk keranjang yang tepat.</p>
      <div class="sort-items" id="sortItems">
        ${SORT_ITEMS.map((it,i)=>`
          <button class="sort-chip" data-idx="${i}">
            ${svgShape(it.key, 52)}
            <span>${it.name}</span>
          </button>
        `).join('')}
      </div>
      <div class="baskets">
        <div class="basket basket-datar" data-basket="datar">
          <div class="basket-title">🔷 Bangun Datar</div>
          <div class="basket-items"></div>
        </div>
        <div class="basket basket-ruang" data-basket="ruang">
          <div class="basket-title">🧊 Bangun Ruang</div>
          <div class="basket-items"></div>
        </div>
      </div>
      <div id="sortResult"></div>
    `,
    init: () => {
      let selected = null;
      let remaining = SORT_ITEMS.length;
      const counts = {datar:0, ruang:0};
      const resultEl = app.querySelector('#sortResult');

      app.querySelectorAll('.sort-chip').forEach(chip=>{
        chip.onclick = ()=>{
          app.querySelectorAll('.sort-chip').forEach(c=>c.classList.remove('selected'));
          chip.classList.add('selected');
          selected = chip;
          speak(SORT_ITEMS[+chip.dataset.idx].name);
        };
      });

      app.querySelectorAll('.basket').forEach(basket=>{
        basket.onclick = ()=>{
          if(!selected){
            speak('Pilih bentuk dulu ya');
            return;
          }
          const idx = +selected.dataset.idx;
          const item = SORT_ITEMS[idx];
          const type = basket.dataset.basket;
          if(item.type === type){
            const el = document.createElement('div');
            el.className = 'basket-item';
            el.innerHTML = `${svgShape(item.key, 42)}<span>${item.name}</span>`;
            basket.querySelector('.basket-items').appendChild(el);
            basket.classList.add('pop');
            setTimeout(()=>basket.classList.remove('pop'), 320);
            selected.remove();
            selected = null;
            remaining--;
            counts[type]++;
            speak('Benar!');
            if(remaining === 0) showResult();
          }else{
            basket.classList.add('shake');
            setTimeout(()=>basket.classList.remove('shake'), 420);
            speak('Belum tepat, coba lagi');
          }
        };
      });

      function showResult(){
        const d = counts.datar, r = counts.ruang;
        const winner = d > r ? 'Bangun datar lebih banyak!' : r > d ? 'Bangun ruang lebih banyak!' : 'Jumlahnya sama banyak!';
        resultEl.innerHTML = `
          <div class="result-panel">
            <h3>🎉 Hebat, semua sudah disortir!</h3>
            <p>Bangun datar: <span class="result-big">${d}</span></p>
            <p>Bangun ruang: <span class="result-big">${r}</span></p>
            <p><b>${winner}</b></p>
            <p>Selisihnya ${Math.abs(d - r)}.</p>
            <button class="btn-primary" id="ulangSortir">Main Lagi 🔁</button>
          </div>
        `;
        resultEl.querySelector('#ulangSortir').onclick = ()=> go('sortir');
        speak(`Hebat! Semua sudah disortir. Bangun datar ada ${d}. Bangun ruang ada ${r}. ${winner}`);
      }
    }
  },

  /* ---------- TANTANGAN ---------- */
  tantangan: {
    html: () => `
      <h2 class="screen-title">🔍 Tantangan di Sekitarku</h2>
      <p class="hint">Perhatikan gambar, lalu jawab pertanyaannya.</p>
      <div class="scene">${SCENE_SVG}</div>
      <div class="quiz-box" id="tantanganQuiz"></div>
    `,
    init: () => {
      const qs = [
        {q:'Ada berapa lingkaran?', ans:3},
        {q:'Ada berapa segitiga?', ans:2},
        {q:'Ada berapa persegi?', ans:2},
        {q:'Ada berapa persegi panjang?', ans:2}
      ].map(item=>({
        prompt: `<p class="q-text">${item.q}</p>`,
        speak: item.q,
        options: [1,2,3,4].map(n=>({
          html: `<span>${n}</span>`,
          cls: 'num',
          correct: n === item.ans
        }))
      }));
      runQuiz(app.querySelector('#tantanganQuiz'), qs);
    }
  }
};

/* =========================================================
   ROUTER
   ========================================================= */
const app = document.getElementById('app');

function topbar(){
  return `
    <div class="topbar">
      <button class="icon-btn" data-home title="Kembali ke menu">🏠</button>
      <div class="app-title">Petualangan Bentuk</div>
      <button class="icon-btn" id="muteBtn" title="Suara">${muted ? '🔇' : '🔊'}</button>
    </div>
  `;
}

function go(name){
  try{ speechSynthesis.cancel(); }catch(e){}
  const s = Screens[name];
  app.innerHTML = topbar() + `<main class="screen">${s.html()}</main>`;
  app.querySelector('[data-home]').onclick = ()=> go('home');
  app.querySelector('#muteBtn').onclick = (e)=>{
    muted = !muted;
    if(muted){ try{ speechSynthesis.cancel(); }catch(err){} }
    e.currentTarget.textContent = muted ? '🔇' : '🔊';
  };
  s.init();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* mulai */
go('home');
</script>
